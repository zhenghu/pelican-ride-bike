<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在同一画布尺寸下，浏览和对比不同版本的鹈鹕骑自行车动画。">
  <title>Pelican Bicycle · 动画对比</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="data/generated/models.js?v=mimopro26" defer></script>
  <script src="data/generated/usage-data.js?v=mimopro26" defer></script>
  <script src="assets/js/usage.js?v=manual-usage" defer></script>
  <script src="assets/js/app.js?v=default-view-2" defer></script>
</head>
<body>
  <header class="topbar topbar-nav">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">P<span>↗</span></span><span>PELICAN <strong>BICYCLE</strong></span></a>
    <span class="top-caption">动画观察室 <span class="divider">/</span> <span id="total-count">27</span> 个版本</span>
    <nav class="page-nav" aria-label="页面导航"><a href="index.html" aria-current="page">预览与对比</a><a href="pages/gallery.html">全部动画</a></nav>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="动画版本">
      <div class="library-heading"><h1>版本库</h1><span class="small-label">COLLECTION</span></div>
      <label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索版本…" aria-label="搜索版本" autocomplete="off"><kbd>/</kbd></label>
      <div class="slot-control"><span>点击版本替换</span><div class="segmented" role="group" aria-label="选择要替换的画面"><button id="target-a" type="button" aria-pressed="true">画面 A</button><button id="target-b" type="button" aria-pressed="false">画面 B</button></div></div>
      <nav id="model-list" class="model-list" aria-label="选择动画版本"></nav>
      <p id="empty-search" class="empty-search" hidden>没有匹配的版本<br><button id="clear-search" class="text-button" type="button">清除搜索</button></p>
      <footer class="sidebar-footer"><span id="result-count"></span><span>原始作品 · 独立预览</span></footer>
    </aside>
    <main>
      <div class="workspace-heading"><div><p class="eyebrow">ONE PROMPT, MANY PERSPECTIVES</p><h2>一只鹈鹕，<span>不同的演绎。</span></h2></div><div class="view-switch segmented" role="group" aria-label="预览模式"><button id="single-mode" type="button" aria-pressed="false">单版预览</button><button id="compare-mode" type="button" aria-pressed="true">双版对比</button></div></div>
      <div class="toolbar"><p id="mode-hint">选择 A 或 B，再从左侧挑选版本。</p><div class="toolbar-actions"><button id="reset-view" class="quiet-button" type="button">恢复默认</button><button id="swap" class="quiet-button" type="button">⇄ 交换位置</button><button id="restart" class="quiet-button" type="button">↻ 同时重播</button></div></div>
      <section id="previews" class="previews" aria-label="动画预览">
        <article id="panel-a" class="preview-panel active-slot" aria-label="画面 A">
          <header class="panel-header"><button class="slot-badge" type="button" data-slot="a" aria-label="选择画面 A" aria-pressed="true">A</button><div class="panel-heading"><h3 id="name-a"></h3><p id="tech-a"></p></div><a id="original-a" class="original-link" target="_blank" rel="noopener">原页 ↗</a></header>
          <div class="stage" id="stage-a"><div class="loading-note" role="status">正在载入画面…</div></div>
          <div id="usage-a"></div>
          <footer class="panel-footer"><span>1000 × 650 <span class="muted">· 等比缩放</span></span><div><button class="step-button" data-slot="a" data-step="-1" type="button" aria-label="画面 A 上一个版本">←</button><span id="position-a" class="position"></span><button class="step-button" data-slot="a" data-step="1" type="button" aria-label="画面 A 下一个版本">→</button></div></footer>
        </article>
        <article id="panel-b" class="preview-panel" aria-label="画面 B">
          <header class="panel-header"><button class="slot-badge" type="button" data-slot="b" aria-label="选择画面 B" aria-pressed="false">B</button><div class="panel-heading"><h3 id="name-b"></h3><p id="tech-b"></p></div><a id="original-b" class="original-link" target="_blank" rel="noopener">原页 ↗</a></header>
          <div class="stage" id="stage-b"><div class="loading-note" role="status">正在载入画面…</div></div>
          <div id="usage-b"></div>
          <footer class="panel-footer"><span>1000 × 650 <span class="muted">· 等比缩放</span></span><div><button class="step-button" data-slot="b" data-step="-1" type="button" aria-label="画面 B 上一个版本">←</button><span id="position-b" class="position"></span><button class="step-button" data-slot="b" data-step="1" type="button" aria-label="画面 B 下一个版本">→</button></div></footer>
        </article>
      </section>
      <p class="usage-period" data-usage-period></p>
      <div class="workspace-footer"><p>同一画布，自由比较。留意脚踏衔接、车轮转动与场景细节。</p><span>PELICAN / STUDIES</span></div>
      <p class="timing-note">重播会同时重新载入画面；各作品的动画周期与起始时刻可能不同。</p>
      <noscript><p>请启用 JavaScript 以使用版本切换。也可直接打开目录中的 HTML 作品。</p></noscript>
    </main>
  </div>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
</body>
</html>
