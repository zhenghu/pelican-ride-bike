<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Unknown-SpaceBunny-Unknown · 夜骑</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #070b1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      color: #cfe3ff;
      overflow: hidden;
    }
    .stage {
      position: relative;
      width: 900px;
      max-width: 96vw;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .75), 0 0 0 1px rgba(140, 180, 255, .16);
      background: #0a1024;
    }
    svg { display: block; width: 100%; height: auto; }
    .caption {
      font-size: 13px;
      letter-spacing: .22em;
      opacity: .55;
      text-transform: uppercase;
    }

    /* ---------- 纯 CSS 动画（作用于 SVG 分组） ---------- */

    /* 整组上下颠簸 */
    .rider {
      animation: bob .34s ease-in-out infinite alternate;
    }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }

    /* 车轮 */
    .spin { transform-box: fill-box; transform-origin: center; animation: spin .55s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 踩踏曲柄 */
    .crank { transform-box: fill-box; transform-origin: 50% 50%; animation: spin .55s linear infinite; }

    /* 翅膀扇动 */
    .wing {
      transform-box: fill-box;
      transform-origin: 90% 20%;
      animation: flap .38s ease-in-out infinite alternate;
    }
    @keyframes flap { from { transform: rotate(-20deg); } to { transform: rotate(14deg); } }

    /* 脖子前后点动（保持身体平稳） */
    .neck { transform-box: fill-box; transform-origin: 20% 100%; animation: nod .7s ease-in-out infinite alternate; }
    @keyframes nod { from { transform: rotate(-2deg); } to { transform: rotate(3deg); } }

    /* 喉囊鼓动 */
    .pouch { transform-box: fill-box; transform-origin: 10% 0%; animation: gulp 1.4s ease-in-out infinite; }
    @keyframes gulp { 0%,100% { transform: scale(1,1); } 45% { transform: scale(1.18,.86); } }

    /* 自行车前灯闪烁 */
    .lamp { animation: flicker 2.4s ease-in-out infinite; }
    @keyframes flicker { 0%,100% { opacity: 1; } 45% { opacity: .78; } 55% { opacity: 1; } }

    /* 车灯锥形光束扫动 */
    .beam { animation: sweep 3.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 0% 50%; }
    @keyframes sweep { from { transform: rotate(-4deg); } to { transform: rotate(6deg); } }

    /* 萤火虫 */
    .firefly { animation: flicker2 2.8s ease-in-out infinite; }
    @keyframes flicker2 { 0%,100% { opacity: .15; } 50% { opacity: 1; } }

    /* 星星闪烁 */
    .twinkle { animation: tw 2.2s ease-in-out infinite alternate; }
    @keyframes tw { from { opacity: .25; } to { opacity: 1; } }

    /* 路面纹理滚动 */
    .road-stripes { animation: scroll 1.1s linear infinite; }
    @keyframes scroll { to { transform: translateX(-90px); } }

    /* 云层缓慢飘移 */
    .cloud { animation: drift 26s linear infinite; }
    @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(940px); } }
  </style>
</head>
<body>

<div class="stage">
<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="夜晚一只鹈鹕骑着自行车">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#050818"/>
      <stop offset="55%"  stop-color="#132347"/>
      <stop offset="100%" stop-color="#2b3f6b"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2440"/>
      <stop offset="100%" stop-color="#0c1224"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0%"   stop-color="#fff8d6" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#fff8d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#ffe9a8" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lampGlow">
      <stop offset="0%"   stop-color="#fff2bd" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== 夜空 ===== -->
  <rect width="900" height="470" fill="url(#sky)"/>

  <!-- 星星 -->
  <g fill="#ffffff">
    <circle class="twinkle" cx="60"  cy="40" r="1.6" style="animation-delay:0s"/>
    <circle class="twinkle" cx="140" cy="90" r="1.2" style="animation-delay:.4s"/>
    <circle class="twinkle" cx="230" cy="35" r="1.8" style="animation-delay:.9s"/>
    <circle class="twinkle" cx="300" cy="120" r="1.1" style="animation-delay:1.3s"/>
    <circle class="twinkle" cx="410" cy="55" r="1.5" style="animation-delay:.2s"/>
    <circle class="twinkle" cx="500" cy="150" r="1.2" style="animation-delay:1.7s"/>
    <circle class="twinkle" cx="620" cy="70" r="1.7" style="animation-delay:1.1s"/>
    <circle class="twinkle" cx="720" cy="180" r="1.1" style="animation-delay:.6s"/>
    <circle class="twinkle" cx="820" cy="55" r="1.5" style="animation-delay:1.5s"/>
    <circle class="twinkle" cx="870" cy="150" r="1.2" style="animation-delay:2s"/>
    <circle class="twinkle" cx="100" cy="185" r="1.1" style="animation-delay:1.9s"/>
    <circle class="twinkle" cx="380" cy="200" r="1.3" style="animation-delay:.7s"/>
  </g>

  <!-- 月亮 -->
  <circle cx="775" cy="72" r="46" fill="url(#moonGlow)"/>
  <circle cx="775" cy="72" r="26" fill="#fdf6d8"/>
  <circle cx="768" cy="66" r="5"  fill="#e9dfb6"/>
  <circle cx="784" cy="80" r="3.5" fill="#e9dfb6"/>

  <!-- 云 -->
  <g class="cloud" opacity=".16" fill="#cfe0ff">
    <ellipse cx="0" cy="0" rx="52" ry="16"/>
    <ellipse cx="38" cy="-9" rx="34" ry="14"/>
    <ellipse cx="-30" cy="-5" rx="28" ry="12"/>
  </g>

  <!-- 远处城市剪影 -->
  <g fill="#0d1730" opacity=".9">
    <rect x="20"  y="250" width="48"  height="90"/>
    <rect x="78"  y="275" width="34"  height="65"/>
    <rect x="122" y="230" width="56"  height="110"/>
    <rect x="188" y="268" width="40"  height="72"/>
    <rect x="238" y="245" width="62"  height="95"/>
    <rect x="640" y="255" width="46"  height="85"/>
    <rect x="696" y="232" width="58"  height="108"/>
    <rect x="764" y="272" width="36"  height="68"/>
    <rect x="810" y="248" width="60"  height="92"/>
  </g>
  <!-- 窗户灯光 -->
  <g fill="#ffd98a" opacity=".55">
    <rect x="34" y="262" width="5" height="7"/><rect x="48" y="262" width="5" height="7"/>
    <rect x="34" y="280" width="5" height="7"/><rect x="140" y="246" width="5" height="7"/>
    <rect x="152" y="246" width="5" height="7"/><rect x="140" y="264" width="5" height="7"/>
    <rect x="256" y="258" width="5" height="7"/><rect x="268" y="276" width="5" height="7"/>
    <rect x="712" y="246" width="5" height="7"/><rect x="726" y="264" width="5" height="7"/>
    <rect x="712" y="282" width="5" height="7"/><rect x="828" y="262" width="5" height="7"/>
  </g>

  <!-- 地面 -->
  <rect x="0" y="338" width="900" height="132" fill="url(#ground)"/>
  <rect x="0" y="334" width="900" height="6" fill="#2f4a7a" opacity=".7"/>

  <!-- 滚动路面纹理 -->
  <g class="road-stripes" stroke="#8fb4ff" stroke-width="3" opacity=".18" stroke-linecap="round">
    <line x1="0"   y1="386" x2="40"  y2="386"/>
    <line x1="90"  y1="386" x2="130" y2="386"/>
    <line x1="180" y1="386" x2="220" y2="386"/>
    <line x1="270" y1="386" x2="310" y2="386"/>
    <line x1="360" y1="386" x2="400" y2="386"/>
    <line x1="450" y1="386" x2="490" y2="386"/>
    <line x1="540" y1="386" x2="580" y2="386"/>
    <line x1="630" y1="386" x2="670" y2="386"/>
    <line x1="720" y1="386" x2="760" y2="386"/>
    <line x1="810" y1="386" x2="850" y2="386"/>
  </g>
  <!-- 滚动路边灯 -->
  <g class="road-stripes" opacity=".55">
    <g transform="translate(30,0)">
      <rect x="0" y="250" width="4" height="88" fill="#1b2745"/>
      <circle cx="2" cy="246" r="7" fill="#ffdf8a" opacity=".8"/>
      <circle cx="2" cy="246" r="16" fill="#ffdf8a" opacity=".12"/>
    </g>
    <g transform="translate(480,0)">
      <rect x="0" y="250" width="4" height="88" fill="#1b2745"/>
      <circle cx="2" cy="246" r="7" fill="#ffdf8a" opacity=".8"/>
      <circle cx="2" cy="246" r="16" fill="#ffdf8a" opacity=".12"/>
    </g>
  </g>

  <!-- 萤火虫 -->
  <g fill="#d7ff8a">
    <circle class="firefly" cx="120" cy="300" r="2.4" style="animation-delay:.2s"/>
    <circle class="firefly" cx="260" cy="330" r="2"   style="animation-delay:1.2s"/>
    <circle class="firefly" cx="580" cy="290" r="2.2" style="animation-delay:1.8s"/>
    <circle class="firefly" cx="740" cy="320" r="2.6" style="animation-delay:.7s"/>
    <circle class="firefly" cx="860" cy="300" r="2"   style="animation-delay:2.4s"/>
  </g>

  <!-- ===== 车灯光束 ===== -->
  <g class="beam">
    <path d="M 470 232 L 900 190 L 900 300 L 470 254 Z" fill="url(#beamGrad)"/>
  </g>

  <!-- ===== 自行车 + 鹈鹕 ===== -->
  <g class="rider">

    <!-- 前轮 -->
    <g class="spin">
      <g transform="translate(470,290)">
        <circle r="52" fill="none" stroke="#dbe7ff" stroke-width="4" opacity=".9"/>
        <g stroke="#7f9dd4" stroke-width="1.4" opacity=".7">
          <line x1="0" y1="-50" x2="0" y2="50"/>
          <line x1="-50" y1="0" x2="50" y2="0"/>
          <line x1="-35" y1="-35" x2="35" y2="35"/>
          <line x1="35" y1="-35" x2="-35" y2="35"/>
          <line x1="-46" y1="-20" x2="46" y2="20"/>
          <line x1="46" y1="-20" x2="-46" y2="20"/>
        </g>
        <circle r="4" fill="#dbe7ff"/>
      </g>
    </g>

    <!-- 后轮 -->
    <g class="spin">
      <g transform="translate(200,290)">
        <circle r="52" fill="none" stroke="#dbe7ff" stroke-width="4" opacity=".9"/>
        <g stroke="#7f9dd4" stroke-width="1.4" opacity=".7">
          <line x1="0" y1="-50" x2="0" y2="50"/>
          <line x1="-50" y1="0" x2="50" y2="0"/>
          <line x1="-35" y1="-35" x2="35" y2="35"/>
          <line x1="35" y1="-35" x2="-35" y2="35"/>
          <line x1="-46" y1="-20" x2="46" y2="20"/>
          <line x1="46" y1="-20" x2="-46" y2="20"/>
        </g>
        <circle r="4" fill="#dbe7ff"/>
      </g>
    </g>

    <!-- 车架 -->
    <g stroke="#ff6b6b" stroke-linecap="round" fill="none">
      <line x1="200" y1="290" x2="305" y2="205" stroke-width="6"/>
      <line x1="305" y1="205" x2="470" y2="290" stroke-width="6"/>
      <line x1="305" y1="205" x2="318" y2="290" stroke-width="5"/>
      <line x1="318" y1="290" x2="470" y2="290" stroke-width="5"/>
      <line x1="200" y1="290" x2="318" y2="290" stroke-width="5"/>
    </g>

    <!-- 前叉 / 车把 -->
    <g stroke="#9fb4dd" stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="470" y1="290" x2="452" y2="212"/>
      <line x1="444" y1="200" x2="468" y2="212"/>
    </g>
    <!-- 车灯 -->
    <g class="lamp">
      <circle cx="472" cy="200" r="18" fill="url(#lampGlow)"/>
      <circle cx="472" cy="200" r="6"  fill="#fff6cf"/>
    </g>

    <!-- 座管 / 车座 -->
    <line x1="305" y1="205" x2="316" y2="176" stroke="#9fb4dd" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="316" cy="173" rx="20" ry="6" fill="#39496b"/>

    <!-- 后货架 + 绑着的鱼（战利品） -->
    <g stroke="#9fb4dd" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="186" y1="238" x2="252" y2="238"/>
      <line x1="196" y1="238" x2="200" y2="290"/>
      <line x1="242" y1="238" x2="236" y2="290"/>
    </g>
    <g transform="translate(214,226) rotate(-12)">
      <path d="M -22 0 Q 0 -11 22 0 Q 0 11 -22 0 Z" fill="#7fd4ff"/>
      <path d="M 22 0 L 33 -7 L 33 7 Z" fill="#5ab6e8"/>
      <circle cx="-14" cy="-1" r="1.8" fill="#0b2440"/>
    </g>

    <!-- 曲柄 + 脚踏 -->
    <g transform="translate(318,290)">
      <circle r="8" fill="#39496b"/>
      <g class="crank">
        <line x1="0" y1="0" x2="18" y2="13" stroke="#c9d8f5" stroke-width="4" stroke-linecap="round"/>
        <rect x="15" y="10" width="12" height="5" rx="2" fill="#0f1a30"/>
        <line x1="0" y1="0" x2="-18" y2="-13" stroke="#c9d8f5" stroke-width="4" stroke-linecap="round"/>
        <rect x="-27" y="-15" width="12" height="5" rx="2" fill="#0f1a30"/>
      </g>
    </g>

    <!-- ===== 鹈鹕 ===== -->
    <g>
      <!-- 腿 -->
      <g stroke="#f0a860" stroke-width="4" stroke-linecap="round" fill="none">
        <line x1="322" y1="220" x2="334" y2="266"/>
        <line x1="308" y1="220" x2="316" y2="266"/>
      </g>
      <ellipse cx="336" cy="268" rx="7" ry="3.5" fill="#f0a860"/>
      <ellipse cx="316" cy="268" rx="7" ry="3.5" fill="#f0a860"/>

      <!-- 尾巴 -->
      <path d="M 300 175 Q 268 168 258 152 Q 274 158 292 170 Z" fill="#e6dcc6"/>
      <path d="M 292 168 Q 270 156 262 146" stroke="#c3b79c" stroke-width="1.4" fill="none"/>

      <!-- 身体 -->
      <ellipse cx="318" cy="155" rx="40" ry="30" fill="#fdf6e3"/>
      <ellipse cx="318" cy="158" rx="37" ry="27" fill="#fffbe8"/>

      <!-- 翅膀 -->
      <g class="wing">
        <path d="M 300 152 Q 282 122 296 98 Q 318 118 324 142 Z"
              fill="#e6dcc6" stroke="#c3b79c" stroke-width="1.2"/>
        <path d="M 304 146 Q 289 122 300 104" stroke="#c3b79c" stroke-width="1" fill="none"/>
        <path d="M 308 138 Q 296 120 303 106" stroke="#c3b79c" stroke-width="1" fill="none"/>
      </g>

      <!-- 脖子 + 头 -->
      <g class="neck">
        <path d="M 344 148 Q 356 122 364 110 Q 374 128 362 154 Z"
              fill="#fffbe8" stroke="#e6dcc6" stroke-width="1.2"/>
        <ellipse cx="368" cy="116" rx="22" ry="18" fill="#fffbe8"/>
        <ellipse cx="368" cy="116" rx="20" ry="16" fill="#fffdf2"/>

        <!-- 眼 -->
        <circle cx="376" cy="110" r="4.6" fill="#ffffff"/>
        <circle cx="377" cy="110" r="2.7" fill="#1b2440"/>
        <circle cx="378" cy="109" r="1.1" fill="#ffffff"/>
        <!-- 眼周纹 -->
        <path d="M 370 106 Q 376 103 382 106" stroke="#d8cbae" stroke-width="1" fill="none"/>

        <!-- 上喙 -->
        <path d="M 384 114 Q 424 110 456 118 Q 448 124 424 125 Q 398 126 384 121 Z"
              fill="#ffc46b" stroke="#dd9a3f" stroke-width="1.2"/>
        <!-- 下喙 -->
        <path d="M 384 121 Q 418 132 452 124 Q 442 134 420 137 Q 396 137 384 128 Z"
              fill="#f0a54c" stroke="#dd9a3f" stroke-width="1.2"/>

        <!-- 喉囊（装着小鱼） -->
        <g class="pouch">
          <path d="M 384 126 Q 404 152 388 174 Q 372 164 376 136 Z"
                fill="#ff9f5a" opacity=".78" stroke="#dd9a3f" stroke-width="1"/>
          <path d="M 384 152 q 6 -5 11 0 q -5 6 -11 0 Z" fill="#7fd4ff" opacity=".9"/>
        </g>

        <!-- 夜骑帽 -->
        <path d="M 350 100 Q 370 88 390 100 Z" fill="#20304f"/>
        <rect x="348" y="98" width="44" height="6" rx="3" fill="#16233c"/>
        <circle cx="370" cy="93" r="4" fill="#6ee7b7"/>
      </g>
    </g>
  </g>

</svg>
</div>

<p class="caption">night ride · 鹈鹕单车</p>

</body>
</html>
