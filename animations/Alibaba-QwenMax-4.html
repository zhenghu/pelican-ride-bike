<style>
  :root {
    color-scheme: light;
    --bg: #f6efe2;
    --fg: #3a3230;
    --muted: #8a7f76;
    --card: #fffaf1;
    --accent: #e2574c;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    min-height: 100%;
    margin: 0;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  }
  .stage {
    width: min(100%, 1000px, calc((100vh - 120px) * 1.6));
    min-width: min(100%, 300px);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 40px -20px rgba(70, 45, 30, .45), 0 2px 6px rgba(70, 45, 30, .12);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .stage svg { display: block; width: 100%; height: auto; }
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px 18px;
  }
  .bar h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .05em; }
  .bar button {
    font: inherit;
    color: inherit;
    min-width: 4.6em;
    padding: 4px 16px;
    border: 1.5px solid currentColor;
    border-radius: 999px;
    background: var(--card);
    cursor: pointer;
  }
  .bar button:hover { color: var(--accent); }
  .bar button:focus-visible, .bar input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bar label { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
  .bar input[type="range"] { width: 130px; accent-color: var(--accent); }
  .bar output { min-width: 2.8em; color: var(--fg); font-variant-numeric: tabular-nums; }
  .hint { margin: 0; color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>

  const $ = id => document.getElementById(id);
  const gullEls = Array.from(document.querySelectorAll('.gull'));

  // 车轮半径 80，曲柄半径 30；轮子转角与前进距离按周长同步，避免打滑。
  const WHEEL_R = 80, CRANK_R = 30, GEAR = 2.0;
  const CADENCE = 1.5 * Math.PI;          // 曲柄角速度 rad/s（约 45 rpm）
  const HIP = { x: -62, y: -118 };        // 髋关节（坐垫上方）
  const L1 = 77, L2 = 80;                 // 大腿 / 小腿长度
  const ANKLE_LIFT = 9;                   // 脚踝相对踏板面的高度

  const state = { t: 0, speed: 1, running: true, last: null };

  function ik(hip, target, l1, l2) {
    let dx = target.x - hip.x, dy = target.y - hip.y;
    let d = Math.hypot(dx, dy);
    const maxD = l1 + l2 - 0.5, minD = Math.abs(l1 - l2) + 0.5;
    if (d > maxD) { dx *= maxD / d; dy *= maxD / d; d = maxD; }
    if (d < minD) { dx *= minD / d; dy *= minD / d; d = minD; }
    const a = Math.atan2(dy, dx);
    const cos = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
    const bend = Math.acos(Math.min(1, Math.max(-1, cos)));
    // 膝盖朝前（骑行方向）弯曲
    const kneeAngle = a - bend;
    return {
      knee: { x: hip.x + l1 * Math.cos(kneeAngle), y: hip.y + l1 * Math.sin(kneeAngle) },
      ankle: { x: hip.x + dx, y: hip.y + dy }
    };
  }

  function setLeg(prefix, crankAngle, bob) {
    const px = CRANK_R * Math.cos(crankAngle);
    const py = CRANK_R * Math.sin(crankAngle);
    const hip = { x: HIP.x, y: HIP.y + bob };
    const target = { x: px, y: py - ANKLE_LIFT };
    const { knee, ankle } = ik(hip, target, L1, L2);
    $(prefix + 'Thigh').setAttribute('d', `M ${hip.x} ${hip.y} L ${knee.x.toFixed(2)} ${knee.y.toFixed(2)}`);
    $(prefix + 'Shin').setAttribute('d', `M ${knee.x.toFixed(2)} ${knee.y.toFixed(2)} L ${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)}`);
    $(prefix + 'Crank').setAttribute('x2', px.toFixed(2));
    $(prefix + 'Crank').setAttribute('y2', py.toFixed(2));
    const pedal = $(prefix + 'Pedal');
    pedal.setAttribute('x', (px - (prefix === 'near' ? 14 : 13)).toFixed(2));
    pedal.setAttribute('y', (py - (prefix === 'near' ? 4.5 : 4)).toFixed(2));
    // 脚掌保持水平踩在踏板上，随曲柄端点平移
    $(prefix + 'Foot').setAttribute('transform', `translate(${px.toFixed(2)} ${(py - ANKLE_LIFT + 4).toFixed(2)})`);
    if (prefix === 'near') {
      $('nearPedalAxle').setAttribute('cx', px.toFixed(2));
      $('nearPedalAxle').setAttribute('cy', py.toFixed(2));
    }
  }

  function wrap(value, period) {
    return -((value % period) + period) % period;
  }

  function render() {
    const t = state.t;
    const crank = t * CADENCE;
    const wheelDeg = (crank * GEAR) * 180 / Math.PI;
    const distance = crank * GEAR * WHEEL_R;

    $('rearWheelSpin').setAttribute('transform', `rotate(${wheelDeg.toFixed(2)})`);
    $('frontWheelSpin').setAttribute('transform', `rotate(${wheelDeg.toFixed(2)})`);

    // 身体随踩踏起伏：每圈两次
    const bob = 2.6 * Math.sin(crank * 2 + 0.6);
    $('bird').setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
    $('shadow').setAttribute('rx', (200 + bob * 2).toFixed(2));

    setLeg('near', crank + Math.PI, bob);
    setLeg('far', crank, bob);

    // 围巾与喉囊的轻微飘动
    const flutter = Math.sin(t * 6.2) * 5;
    const flutter2 = Math.sin(t * 6.2 + 1.4) * 4;
    $('scarfTail').setAttribute('transform', `rotate(${flutter.toFixed(2)} 8 -200)`);
    $('scarfTail2').setAttribute('transform', `rotate(${flutter2.toFixed(2)} 6 -196)`);
    const pouchScale = 1 + 0.03 * Math.sin(t * 3.1);
    $('pouch').setAttribute('transform', `translate(66 -238) scale(1 ${pouchScale.toFixed(3)}) translate(-66 238)`);
    $('fish').setAttribute('transform', `translate(6 -14) rotate(${(Math.sin(t * 2.4) * 8).toFixed(2)})`);

    // 视差滚动：各层按自身周期无缝循环
    $('cloudsFar').setAttribute('transform', `translate(${wrap(distance * 0.045, 1000).toFixed(2)} 0)`);
    $('cloudsNear').setAttribute('transform', `translate(${wrap(distance * 0.09, 1000).toFixed(2)} 0)`);
    $('headland').setAttribute('transform', `translate(${wrap(distance * 0.06, 1000).toFixed(2)} 0)`);
    $('waves').setAttribute('transform', `translate(${wrap(distance * 0.16, 1000).toFixed(2)} 0)`);
    $('grassDecor').setAttribute('transform', `translate(${wrap(distance * 0.55, 1000).toFixed(2)} 0)`);
    $('posts').setAttribute('transform', `translate(${wrap(distance * 0.8, 960).toFixed(2)} 0)`);
    $('roadDashes').setAttribute('transform', `translate(${wrap(distance, 160).toFixed(2)} 0)`);
    $('foreground').setAttribute('transform', `translate(${wrap(distance * 1.25, 1000).toFixed(2)} 0)`);

    // 帆船缓慢横穿海面
    const boatX = 1080 - ((t * 26) % 1240);
    $('sailboat').setAttribute('transform', `translate(${boatX.toFixed(2)} ${(318 + Math.sin(t * 1.7) * 2).toFixed(2)})`);

    // 海鸥振翅与滑翔
    for (const gull of gullEls) {
      const phase = Number(gull.dataset.phase);
      const flap = Math.sin(t * 7 + phase);
      const glide = 0.55 + 0.45 * Math.max(0, Math.sin(t * 0.9 + phase));
      gull.setAttribute('transform', `translate(${(Math.sin(t * 0.7 + phase) * 14).toFixed(2)} ${(Math.sin(t * 1.3 + phase) * 6).toFixed(2)}) scale(1 ${(0.35 + flap * 0.65 * glide).toFixed(3)})`);
    }
    $('gulls').setAttribute('transform', `translate(${wrap(distance * 0.03, 1000).toFixed(2)} 0)`);
  }

  function frame(now) {
    if (state.last === null) state.last = now;
    const dt = Math.min(0.05, (now - state.last) / 1000);
    state.last = now;
    if (state.running) {
      state.t += dt * state.speed;
      render();
    }
    requestAnimationFrame(frame);
  }

  const toggleBtn = $('toggle');
  function setRunning(run) {
    state.running = run;
    toggleBtn.textContent = run ? '暂停' : '继续';
    toggleBtn.setAttribute('aria-pressed', String(!run));
  }
  toggleBtn.addEventListener('click', () => setRunning(!state.running));
  $('stage').addEventListener('click', () => setRunning(!state.running));
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !/INPUT|BUTTON/.test(document.activeElement.tagName)) {
      e.preventDefault();
      setRunning(!state.running);
    }
  });
  const speedInput = $('speed'), speedOut = $('speedOut');
  speedInput.addEventListener('input', () => {
    state.speed = Number(speedInput.value);
    speedOut.textContent = state.speed.toFixed(1) + '×';
  });

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    state.t = 0.42;
    render();
    setRunning(false);
  } else {
    render();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
