<title>Xiaomi-MiMoPro-2.6 · 鹈鹕骑自行车</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { height: 100%; background: #d8f0fb; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  svg { display: block; width: 100vw; height: 100vh; }

  /* ---------- CSS 动画 ---------- */
  @keyframes cloudDrift { from { transform: translateX(1150px); } to { transform: translateX(-280px); } }
  .cloud1 { animation: cloudDrift 17s linear infinite; }
  .cloud2 { animation: cloudDrift 23s linear infinite; animation-delay: -9s; }
  .cloud3 { animation: cloudDrift 29s linear infinite; animation-delay: -18s; }

  @keyframes scrollX { from { transform: translateX(0); } to { transform: translateX(-240px); } }
  .ground-scroll { animation: scrollX 0.4s linear infinite; }

  @keyframes chainRun { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -12; } }
  .chain { animation: chainRun 0.35s linear infinite; }

  @keyframes wingFlap {
    from { transform: rotate(-5deg); }
    to   { transform: rotate(9deg); }
  }
  .wing { transform-box: view-box; transform-origin: 452px 282px; animation: wingFlap 0.5s ease-in-out infinite alternate; }

  @keyframes tailWag {
    from { transform: rotate(-7deg); }
    to   { transform: rotate(8deg); }
  }
  .tail { transform-box: view-box; transform-origin: 396px 292px; animation: tailWag 0.42s ease-in-out infinite alternate; }

  @keyframes scarfWave1 {
    from { transform: rotate(-10deg); }
    to   { transform: rotate(9deg); }
  }
  .scarf1 { transform-box: view-box; transform-origin: 508px 242px; animation: scarfWave1 0.6s ease-in-out infinite alternate; }

  @keyframes scarfWave2 {
    from { transform: rotate(8deg); }
    to   { transform: rotate(-11deg); }
  }
  .scarf2 { transform-box: view-box; transform-origin: 510px 252px; animation: scarfWave2 0.5s ease-in-out infinite alternate; animation-delay: -0.25s; }

  @keyframes sunSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .sun-rays { transform-box: view-box; transform-origin: 880px 108px; animation: sunSpin 46s linear infinite; }

  @keyframes butterflyWander {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(46px, -24px); }
    50%  { transform: translate(88px, 6px); }
    75%  { transform: translate(40px, 26px); }
    100% { transform: translate(0, 0); }
  }
  .butterfly { animation: butterflyWander 8s ease-in-out infinite; }

  @keyframes wingBeat {
    from { transform: rotate(-22deg); }
    to   { transform: rotate(22deg); }
  }
  .bfly-l { transform-box: view-box; transform-origin: 238px 216px; animation: wingBeat 0.34s ease-in-out infinite alternate; }
  .bfly-r { transform-box: view-box; transform-origin: 238px 216px; animation: wingBeat 0.34s ease-in-out infinite alternate-reverse; }

  @keyframes speedPulse { 0%, 100% { opacity: .15; } 50% { opacity: .6; } }
  .speed1 { animation: speedPulse 0.7s ease-in-out infinite; }
  .speed2 { animation: speedPulse 0.7s ease-in-out infinite; animation-delay: -0.23s; }
  .speed3 { animation: speedPulse 0.7s ease-in-out infinite; animation-delay: -0.46s; }
</style>
