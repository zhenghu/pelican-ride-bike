<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Anthropic-ClaudeOpus-5.5 · 鹈鹕骑自行车</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d2433; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
  .wrap { width: min(96vw, 1000px); }
  svg { width: 100%; height: auto; display: block; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.45); cursor: pointer; }
  .hint { color: #9aa6bf; text-align: center; margin-top: 12px; font-size: 14px; }
  .blink { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
  .speed line { stroke: #ffffff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 30 90; animation: dash .8s linear infinite; opacity: .7; }
  .speed line:nth-child(2) { animation-delay: -.3s; }
  .speed line:nth-child(3) { animation-delay: -.55s; }
  @keyframes dash { from { stroke-dashoffset: 120; } to { stroke-dashoffset: 0; } }
  .paused * { animation-play-state: paused !important; }
</style>
</head>
<body>
<div class="wrap">
<svg id="scene" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4f2" />
      <stop offset="1" stop-color="#d9f0ff" />
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c2" />
      <stop offset="0.6" stop-color="#ffd95a" />
      <stop offset="1" stop-color="#ffd95a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b5f68" />
      <stop offset="1" stop-color="#3f424a" />
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7a24a" />
      <stop offset="1" stop-color="#e2702a" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e6e0d4" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="500" fill="url(#sky)" />
  <circle cx="660" cy="90" r="70" fill="url(#sun)" />
  <circle cx="660" cy="90" r="34" fill="#ffe27a" />

  <g id="clouds" fill="#ffffff" opacity="0.9"></g>

  <path id="hillsFar" fill="#9fd39a" />
  <path id="hillsNear" fill="#6fbf6a" />
  <rect x="0" y="385" width="800" height="20" fill="#5aa857" />
  <g id="flowers"></g>

  <!-- 道路 -->
  <rect x="0" y="400" width="800" height="100" fill="url(#road)" />
  <line id="roadDash" x1="0" y1="455" x2="800" y2="455" stroke="#f2e6b8" stroke-width="6" stroke-dasharray="44 34" />
  <ellipse cx="375" cy="403" rx="175" ry="8" fill="#000" opacity="0.22" />

  <!-- 速度线 -->
  <g class="speed">
    <line x1="80" y1="200" x2="200" y2="200" />
    <line x1="60" y1="250" x2="180" y2="250" />
    <line x1="100" y1="300" x2="200" y2="300" />
  </g>

  <g id="rider">
    <!-- 远侧腿 + 曲柄（在车架后面） -->
    <g id="farSide">
      <path id="farLeg" fill="none" stroke="#d06a12" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <path id="farFoot" fill="#d06a12" />
      <line id="farCrank" x1="360" y1="340" stroke="#555" stroke-width="6" stroke-linecap="round" />
      <rect id="farPedal" width="18" height="5" rx="2" fill="#333" />
    </g>

    <!-- 车轮 -->
    <g id="rearWheel"></g>
    <g id="frontWheel"></g>

    <!-- 链条 -->
    <line x1="250" y1="321" x2="360" y2="322" stroke="#444" stroke-width="2.5" />
    <line x1="250" y1="339" x2="360" y2="358" stroke="#444" stroke-width="2.5" />
    <circle cx="250" cy="330" r="9" fill="none" stroke="#666" stroke-width="3" />

    <!-- 车架 -->
    <g stroke="#e0463c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="250" y1="330" x2="360" y2="340" />
      <line x1="250" y1="330" x2="338" y2="252" />
      <line x1="360" y1="340" x2="336" y2="246" />
      <line x1="338" y1="254" x2="462" y2="228" />
      <line x1="360" y1="340" x2="468" y2="246" />
      <line x1="462" y1="222" x2="470" y2="250" stroke-width="10" />
    </g>
    <line x1="470" y1="248" x2="500" y2="330" stroke="#b9bcc4" stroke-width="7" stroke-linecap="round" />
    <line x1="462" y1="224" x2="466" y2="202" stroke="#b9bcc4" stroke-width="6" stroke-linecap="round" />
    <path d="M462 204 Q478 194 490 206" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" />
    <line x1="486" y1="203" x2="494" y2="212" stroke="#222" stroke-width="8" stroke-linecap="round" />
    <!-- 车灯 -->
    <circle cx="474" cy="236" r="6" fill="#ffe27a" stroke="#333" stroke-width="2" />
    <!-- 车座 -->
    <path d="M308 242 Q330 232 354 239 Q342 249 312 249 Z" fill="#2b2b2b" />

    <!-- 牙盘 -->
    <g id="chainring">
      <circle cx="360" cy="340" r="18" fill="none" stroke="#777" stroke-width="4" stroke-dasharray="4 3" />
      <circle cx="360" cy="340" r="6" fill="#777" />
    </g>

    <!-- 鹈鹕 -->
    <g id="pelican">
      <!-- 尾巴 -->
      <path d="M290 190 L250 180 L256 200 L246 214 L292 214 Z" fill="#d8d1c3" stroke="#b9b1a2" stroke-width="2" stroke-linejoin="round" />
      <!-- 脖子 -->
      <path d="M368 190 Q392 138 420 112" fill="none" stroke="#c9c1b2" stroke-width="30" stroke-linecap="round" />
      <path d="M368 190 Q392 138 420 112" fill="none" stroke="#f7f3ea" stroke-width="25" stroke-linecap="round" />
      <!-- 身体 -->
      <ellipse cx="335" cy="200" rx="60" ry="39" fill="url(#bodyGrad)" stroke="#c9c1b2" stroke-width="2.5" />
      <!-- 围巾 -->
      <path id="scarfTail" fill="none" stroke="#e0463c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
      <path id="scarfTail2" fill="none" stroke="#c7332a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <ellipse cx="384" cy="158" rx="16" ry="7" transform="rotate(-35 384 158)" fill="#e0463c" />
      <!-- 头 -->
      <path d="M404 96 Q396 84 410 86 Q404 78 418 84" fill="none" stroke="#f3d57a" stroke-width="4" stroke-linecap="round" />
      <circle cx="424" cy="108" r="20" fill="#f7f3ea" stroke="#c9c1b2" stroke-width="2.5" />
      <!-- 喉囊 + 喙 -->
      <path d="M440 114 L548 123 Q505 172 454 142 Q444 130 440 114 Z" fill="url(#pouch)" stroke="#c25c1f" stroke-width="2" stroke-linejoin="round" />
      <path d="M437 98 L548 115 Q556 120 548 124 L440 115 Z" fill="#f4bb3c" stroke="#c98a1c" stroke-width="2" stroke-linejoin="round" />
      <path d="M548 115 Q558 118 552 128" fill="none" stroke="#c98a1c" stroke-width="3" stroke-linecap="round" />
      <!-- 眼睛 -->
      <circle cx="428" cy="101" r="6" fill="#fff4c9" stroke="#8d7a55" stroke-width="1.5" />
      <g class="blink"><circle cx="429" cy="101" r="3" fill="#1f1f1f" /><circle cx="430" cy="100" r="1" fill="#fff" /></g>
      <!-- 翅膀（伸向车把） -->
      <path d="M292 190 C320 156 392 160 438 186 L488 202 L478 212 C432 214 380 222 318 222 Q296 212 292 190 Z" fill="#cfc8ba" stroke="#a79f90" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M300 205 C340 200 390 204 440 200" fill="none" stroke="#8f887b" stroke-width="3" stroke-linecap="round" />
      <path d="M306 215 C345 212 390 214 430 208" fill="none" stroke="#6f695f" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- 近侧腿 + 曲柄 -->
    <g id="nearSide">
      <line id="nearCrank" x1="360" y1="340" stroke="#888" stroke-width="6" stroke-linecap="round" />
      <path id="nearLeg" fill="none" stroke="#f28c28" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <rect id="nearPedal" width="18" height="5" rx="2" fill="#222" />
      <path id="nearFoot" fill="#f28c28" stroke="#c96a14" stroke-width="1.5" stroke-linejoin="round" />
      <circle cx="360" cy="340" r="4" fill="#ccc" />
    </g>
  </g>

  <text x="24" y="40" font-size="22" font-weight="700" fill="#1d3557" opacity="0.8">🚲 鹈鹕出门兜风</text>
</svg>
<div class="hint">点击画面暂停 / 继续</div>
</div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };

  // ---- 车轮 ----
  const R = 70;
  function buildWheel(g, cx, cy) {
    el('circle', { cx, cy, r: R, fill: 'none', stroke: '#222', 'stroke-width': 9 }, g);
    el('circle', { cx, cy, r: R - 7, fill: 'none', stroke: '#a7abb3', 'stroke-width': 3 }, g);
    const spokes = el('g', {}, g);
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2;
      el('line', { x1: cx, y1: cy, x2: cx + Math.cos(a) * (R - 8), y2: cy + Math.sin(a) * (R - 8), stroke: '#c9ccd2', 'stroke-width': 1.5 }, spokes);
    }
    el('circle', { cx: cx + R - 20, cy, r: 4, fill: '#f4bb3c' }, spokes); // 反光片
    el('circle', { cx, cy, r: 6, fill: '#888', stroke: '#555', 'stroke-width': 2 }, g);
    return spokes;
  }
  const rearSpokes = buildWheel($('rearWheel'), 250, 330);
  const frontSpokes = buildWheel($('frontWheel'), 500, 330);

  // ---- 山丘 ----
  function hillPath(period, h, base) {
    const count = Math.ceil(800 / period) + 2;
    let d = `M0 ${base}`;
    for (let i = 0; i < count; i++) {
      const x = i * period;
      d += ` C${x + period * 0.3} ${base - h} ${x + period * 0.7} ${base - h} ${x + period} ${base}`;
    }
    return d + ` L${count * period} 500 L0 500 Z`;
  }
  const hillsFar = $('hillsFar'), hillsNear = $('hillsNear');
  hillsFar.setAttribute('d', hillPath(360, 120, 400));
  hillsNear.setAttribute('d', hillPath(240, 70, 400));

  // ---- 云 ----
  const clouds = [
    { x: 120, y: 90, s: 1.0 }, { x: 430, y: 60, s: 0.7 }, { x: 760, y: 120, s: 1.2 }, { x: 980, y: 70, s: 0.8 }
  ].map(c => {
    const g = el('g', {}, $('clouds'));
    el('ellipse', { cx: 0, cy: 0, rx: 42, ry: 18 }, g);
    el('ellipse', { cx: -22, cy: -8, rx: 24, ry: 18 }, g);
    el('ellipse', { cx: 18, cy: -14, rx: 26, ry: 22 }, g);
    return { ...c, g };
  });

  // ---- 路边小花 ----
  const flowers = $('flowers');
  const colors = ['#ff6b8a', '#ffd166', '#ffffff', '#c77dff'];
  for (let i = 0; i < 14; i++) {
    const x = i * 70 + (i % 3) * 13, y = 392 + (i % 2) * 5;
    el('line', { x1: x, y1: y, x2: x, y2: y + 10, stroke: '#3d8b3a', 'stroke-width': 2 }, flowers);
    el('circle', { cx: x, cy: y, r: 4, fill: colors[i % colors.length] }, flowers);
    el('circle', { cx: x, cy: y, r: 1.5, fill: '#b5651d' }, flowers);
  }

  // ---- 腿部 IK ----
  const BB = { x: 360, y: 340 }, CRANK = 28, L1 = 68, L2 = 70;
  function knee(hip, p) {
    const dx = p.x - hip.x, dy = p.y - hip.y;
    const d = Math.min(Math.hypot(dx, dy), L1 + L2 - 0.5);
    const a = Math.atan2(dy, dx);
    const b = Math.acos((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d));
    return { x: hip.x + L1 * Math.cos(a - b), y: hip.y + L1 * Math.sin(a - b) };
  }
  function drawSide(prefix, angle, hip) {
    const p = { x: BB.x + Math.cos(angle) * CRANK, y: BB.y + Math.sin(angle) * CRANK };
    const crank = $(prefix + 'Crank');
    crank.setAttribute('x2', p.x); crank.setAttribute('y2', p.y);
    const pedal = $(prefix + 'Pedal');
    pedal.setAttribute('x', p.x - 9); pedal.setAttribute('y', p.y - 2);
    const k = knee(hip, p);
    const fy = p.y - 3;
    $(prefix + 'Leg').setAttribute('d', `M${hip.x} ${hip.y} L${k.x} ${k.y} L${p.x} ${fy}`);
    $(prefix + 'Foot').setAttribute('d',
      `M${p.x - 5} ${fy} L${p.x + 17} ${fy - 1} Q${p.x + 14} ${fy - 5} ${p.x + 18} ${fy - 8} L${p.x + 2} ${fy - 6} Z`);
  }

  // ---- 围巾 ----
  function scarf(id, t, len, amp, phase, yOff) {
    let d = '';
    for (let i = 0; i <= 8; i++) {
      const u = i / 8;
      const x = 378 - u * len;
      const y = 163 + yOff + u * 14 + Math.sin(t * 12 - u * 5 + phase) * amp * u;
      d += (i ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    $(id).setAttribute('d', d);
  }

  // ---- 主循环 ----
  const svg = $('scene');
  const SPEED = 170; // px/s
  let dist = 0, time = 0, last = null, paused = false;

  svg.addEventListener('click', () => {
    paused = !paused;
    svg.classList.toggle('paused', paused);
    last = null;
  });

  function frame(now) {
    if (last === null) last = now;
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (!paused) { dist += SPEED * dt; time += dt; }

    const wheelDeg = (dist / R) * 180 / Math.PI;
    rearSpokes.setAttribute('transform', `rotate(${wheelDeg} 250 330)`);
    frontSpokes.setAttribute('transform', `rotate(${wheelDeg} 500 330)`);

    const crankA = (dist / R) * 0.55;
    $('chainring').setAttribute('transform', `rotate(${crankA * 180 / Math.PI} 360 340)`);

    // 身体随踩踏上下起伏
    const bob = Math.sin(crankA * 2) * 2.2;
    const sway = Math.sin(crankA) * 1.2;
    $('pelican').setAttribute('transform', `translate(0 ${bob}) rotate(${sway} 335 220)`);
    $('rider').setAttribute('transform', `translate(0 ${Math.sin(time * 9) * 0.8})`);

    const hip = { x: 350, y: 232 + bob };
    drawSide('far', crankA + Math.PI, { x: hip.x - 4, y: hip.y - 2 });
    drawSide('near', crankA, hip);

    scarf('scarfTail', time, 70, 8, 0, 0);
    scarf('scarfTail2', time, 55, 7, 1.7, 6);

    hillsFar.setAttribute('transform', `translate(${-(dist * 0.15) % 360} 0)`);
    hillsNear.setAttribute('transform', `translate(${-(dist * 0.35) % 240} 0)`);
    flowers.setAttribute('transform', `translate(${-(dist * 0.8) % 70} 0)`);
    $('roadDash').setAttribute('stroke-dashoffset', dist % 78);

    for (const c of clouds) {
      const x = ((c.x - dist * 0.05) % 1100 + 1100) % 1100 - 150;
      c.g.setAttribute('transform', `translate(${x} ${c.y}) scale(${c.s})`);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
