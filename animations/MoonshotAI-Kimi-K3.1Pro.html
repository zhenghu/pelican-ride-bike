<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const TAU = Math.PI * 2;
  const WHEEL_RADIUS = 82;
  const CRANK_RADIUS = 34;
  const PEDAL_PERIOD = 1.65;
  const GEAR_RATIO = .48;
  const BB = { x: 504, y: 444 };
  const THIGH = 95;
  const SHIN = 90;
  const MAX_REACH = THIGH + SHIN - .5;
  let elapsed = 0;
  let previous = null;
  let paused = reducedMotion.matches;
  let animationFrame = 0;
  const hillGap = 320;

  function setPath(id, from, to) {
    $(id).setAttribute('d', `M${from.x.toFixed(2)} ${from.y.toFixed(2)}L${to.x.toFixed(2)} ${to.y.toFixed(2)}`);
  }

  function drawLeg(side, angle, hip) {
    const foot = {
      x: BB.x + Math.cos(angle) * CRANK_RADIUS,
      y: BB.y + Math.sin(angle) * CRANK_RADIUS - 7
    };
    const dx = foot.x - hip.x;
    const dy = foot.y - hip.y;
    const distance = Math.min(Math.hypot(dx, dy), MAX_REACH);
    const heading = Math.atan2(dy, dx);
    const bend = Math.acos((THIGH * THIGH + distance * distance - SHIN * SHIN) / (2 * THIGH * distance));
    const kneeAngle = heading - bend;
    const knee = { x: hip.x + Math.cos(kneeAngle) * THIGH, y: hip.y + Math.sin(kneeAngle) * THIGH };
    setPath(`${side}-thigh-outline`, hip, knee);
    setPath(`${side}-thigh`, hip, knee);
    setPath(`${side}-shin-outline`, knee, foot);
    setPath(`${side}-shin`, knee, foot);
    setPath(`${side}-crank`, BB, { x: foot.x, y: foot.y + 7 });
    $(`${side}-foot`).setAttribute('transform', `translate(${foot.x} ${foot.y})`);
    $(`${side}-pedal`).setAttribute('transform', `translate(${foot.x} ${foot.y + 8})`);
    if (side === 'near') {
      const feather = { x: hip.x + (knee.x - hip.x) * .62, y: hip.y + (knee.y - hip.y) * .62 };
      $('near-feather-line').setAttribute('d', `M${hip.x - 1} ${hip.y + 4}Q${feather.x + 8} ${feather.y} ${knee.x - 1} ${knee.y - 4}`);
    }
  }

  function scarfPath(startX, startY, length, amplitude, phase) {
    let path = '';
    for (let index = 0; index <= 12; index++) {
      const progress = index / 12;
      const x = startX - progress * length;
      const y = startY + progress * 16 + Math.sin(elapsed * 5.5 - progress * 5 + phase) * amplitude * progress;
      path += `${index ? 'L' : 'M'}${x.toFixed(2)} ${y.toFixed(2)}`;
    }
    return path;
  }

  function render() {
    const pedalAngle = elapsed * TAU / PEDAL_PERIOD;
    const wheelAngle = pedalAngle * GEAR_RATIO * 180 / Math.PI;
    const distance = elapsed * TAU / PEDAL_PERIOD * GEAR_RATIO * WHEEL_RADIUS;
    const bob = Math.sin(pedalAngle * 2) * 1.7;
    const hipNear = { x: 437, y: 307 + bob };
    const hipFar = { x: 443, y: 305 + bob };

    $('rear-rotor').setAttribute('transform', `rotate(${wheelAngle})`);
    $('front-rotor').setAttribute('transform', `rotate(${wheelAngle})`);
    $('chainring').setAttribute('transform', `rotate(${pedalAngle * 180 / Math.PI} 504 444)`);
    $('chain').setAttribute('stroke-dashoffset', (-elapsed * 28).toFixed(2));
    $('rider').setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
    drawLeg('far', pedalAngle + Math.PI, hipFar);
    drawLeg('near', pedalAngle, hipNear);
    $('scarf-tail-back').setAttribute('d', scarfPath(497, 187, 90, 11, 1));
    $('scarf-tail-front').setAttribute('d', scarfPath(499, 184, 112, 13, 0));
    $('scarf-stripe').setAttribute('d', scarfPath(499, 184, 112, 13, 0));
    $('roadside').setAttribute('transform', `translate(${-(distance % 250)} 0)`);
    $('hills').setAttribute('transform', `translate(${-(distance * .08 % hillGap)} 0)`);

    const blinkPhase = elapsed % 5.7;
    const eyeScale = blinkPhase > 5.35 && blinkPhase < 5.57 ? .13 : 1;
    $('eye').setAttribute('transform', `translate(0 ${(130 * (1 - eyeScale)).toFixed(2)}) scale(1 ${eyeScale})`);
  }

  function syncControl() {
    $('toggle').textContent = paused ? '播放动画' : '暂停动画';
    $('toggle').setAttribute('aria-pressed', String(paused));
    $('motion-hint').textContent = paused ? '停一下，看看海。' : '海风正好，慢慢骑。';
    document.querySelectorAll('.cloud').forEach(cloud => {
      cloud.style.animationPlayState = paused ? 'paused' : 'running';
    });
  }

  function tick(now) {
    if (previous !== null) elapsed += Math.min((now - previous) / 1000, .06);
    previous = now;
    render();
    animationFrame = 0;
    if (!paused && !document.hidden) animationFrame = requestAnimationFrame(tick);
  }

  function start() {
    if (!animationFrame && !paused && !document.hidden) {
      previous = null;
      animationFrame = requestAnimationFrame(tick);
    }
  }

  function stop() {
    cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    previous = null;
  }

  $('toggle').addEventListener('click', () => {
    paused = !paused;
    if (paused) stop(); else start();
    syncControl();
  });
  reducedMotion.addEventListener('change', event => {
    if (event.matches) { paused = true; stop(); syncControl(); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stop(); else start();
  });
  render();
  syncControl();
  start();
})();
</script>
</body>
</html>
