<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tencent-HunyuanPreview-4 · 鹈鹕骑自行车</title>
<style>
  :root {
    --ink: #0f172a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(120% 120% at 50% 0%, #1e293b 0%, #0b1220 60%, #060a14 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage {
    width: min(96vw, 1000px);
    padding: 18px 18px 10px;
  }
  .frame {
    position: relative;
    border-radius: 22px;
    overflow: hidden;
    background: #cdeeff;
    box-shadow: 0 30px 70px -20px rgba(0, 0, 0, .75),
                0 0 0 1px rgba(255, 255, 255, .08) inset;
  }
  svg { display: block; width: 100%; height: auto; }

  .caption {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 6px 2px;
    font-size: 13px;
    letter-spacing: .04em;
    color: #94a3b8;
  }
  .caption b { color: #f8fafc; font-weight: 600; letter-spacing: .02em; }

  /* ---------- 纯位移动画（CSS 对 SVG 无歧义） ---------- */
  @keyframes drift {
    from { transform: translateX(900px); }
    to   { transform: translateX(-320px); }
  }
  .cloud { animation: drift linear infinite; }

  @keyframes dash {
    from { transform: translateX(0); }
    to   { transform: translateX(-80px); }
  }
  .dashes { animation: dash .42s linear infinite; }

  @keyframes streak {
    0%   { transform: translateX(180px); opacity: 0; }
    12%  { opacity: .8; }
    80%  { opacity: .8; }
    100% { transform: translateX(-900px); opacity: 0; }
  }
  .streak { animation: streak linear infinite; }

  @media (prefers-reduced-motion: reduce) {
    .cloud, .dashes, .streak { animation: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="frame">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="一只鹈鹕骑着自行车前进的 2D 动画">

        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">

          <stop offset="100%" stop-color="#eaf9ff"/>

          <stop offset="55%"  stop-color="#eef3f8"/>
          <stop offset="100%" stop-color="#cdd8e4"/>

          <stop offset="60%"  stop-color="#c9d6e3"/>
          <stop offset="100%" stop-color="#a9b9ca"/>
        </linearGradient>
        <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#ffd166"/>
          <stop offset="100%" stop-color="#f08c1a"/>
        </linearGradient>
        <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#ffc94d"/>
          <stop offset="100%" stop-color="#ef8a12"/>

        <radialGradient id="sunG" cx="0.5" cy="0.5" r="0.5">

          <stop offset="100%" stop-color="#ffe9a3" stop-opacity="0"/>

        <!-- 12 根辐条，中心在 (0,0) -->

          <line x1="0" y1="-6"  x2="0" y2="-60" transform="rotate(270)"/>

      <!-- ================= 近侧曲柄 + 脚踏 ================= -->

        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="0 385 330; 30 385 330; 60 385 330; 90 385 330; 120 385 330; 150 385 330; 180 385 330; 210 385 330; 240 385 330; 270 385 330; 300 385 330; 330 385 330; 360 385 330"
