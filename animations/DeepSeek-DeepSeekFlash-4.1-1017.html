<title>DeepSeek-DeepSeekFlash-4.1-1017 · 鹈鹕骑自行车</title>
<style>
  :root {
    --ink: #e8eefc;
    --muted: #93a3bd;
    --mint: #5eead4;
    --amber: #f0c674;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #05070f;
    overflow: hidden;
    font-family: ui-sans-serif, -apple-system, "PingFang SC", "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
  }
  .stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
  svg#scene { display: block; width: 100%; height: 100%; }

  /* ── 用量标注 ─────────────────────────────────────────────── */
  .hud { position: absolute; top: 22px; left: 22px; z-index: 5; }
  .hud-card {
    min-width: 272px;
    padding: 14px 16px 12px;
    border-radius: 16px;
    background: linear-gradient(155deg, rgba(20, 27, 45, .86), rgba(10, 14, 26, .74));
    border: 1px solid rgba(255, 255, 255, .13);
    box-shadow: 0 22px 48px -22px rgba(0, 0, 0, .95), inset 0 1px 0 rgba(255, 255, 255, .07);
    backdrop-filter: blur(16px) saturate(1.25);
    -webkit-backdrop-filter: blur(16px) saturate(1.25);
  }
  .hud-head { display: flex; align-items: center; gap: 8px; }
  .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 10px var(--mint);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .model { font-size: 13px; font-weight: 600; letter-spacing: .2px; }
  .badge {
    margin-left: auto;
    font-size: 10px; letter-spacing: .08em;
    padding: 2px 7px; border-radius: 999px;
    color: #ffd9a0;
    background: rgba(240, 198, 116, .14);
    border: 1px solid rgba(240, 198, 116, .35);
  }
  .hud-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-top: 12px;
  }
  .metric {
    display: flex; flex-direction: column; gap: 2px;
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(255, 255, 255, .045);
    border: 1px solid rgba(255, 255, 255, .06);
  }
  .label { font-size: 10px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
  .value {
    font: 600 19px/1.15 ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
    color: #fff;
  }
  .value .unit { font-size: 12px; color: var(--muted); margin-left: 2px; }
  .sub { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hud-foot {
    margin-top: 10px; padding-top: 9px;
    border-top: 1px solid rgba(255, 255, 255, .07);
    font-size: 10.5px; color: var(--muted); letter-spacing: .02em;
  }
  .caption {
    position: absolute; right: 22px; bottom: 18px;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: rgba(232, 238, 252, .5);
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(94, 234, 212, .55); }
    50% { opacity: .55; box-shadow: 0 0 0 7px rgba(94, 234, 212, 0); }
  }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1400px); } }
  @keyframes twinkle { 0%, 100% { opacity: .16; } 50% { opacity: .85; } }
  @keyframes shimmer { 0%, 100% { opacity: .16; transform: scaleX(.72); } 50% { opacity: .58; transform: scaleX(1.08); } }
  @keyframes sunPulse { 0%, 100% { opacity: .88; } 50% { opacity: 1; } }

  .cloud-a { animation: drift 64s linear infinite; }
  .cloud-b { animation: drift 92s linear infinite; }
  .cloud-c { animation: drift 124s linear infinite; }
  .star { animation: twinkle 4.2s ease-in-out infinite; }
  .shimmer { animation: shimmer 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .sun-core { animation: sunPulse 6s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .cloud-a, .cloud-b, .cloud-c, .star, .shimmer, .sun-core, .pulse { animation: none; }
  }
</style>

          fill="none" opacity=".6"/>
    <g>
      <path d="M528,178 C 548,170 570,172 584,182 C 570,192 548,192 530,188 Z" fill="#ef476f"/>
      <path d="M532,184 C 508,196 486,214 470,236 C 486,232 506,220 526,204 Z" fill="#ef476f"/>
      <path d="M534,190 C 514,206 500,226 492,248 C 506,240 522,224 538,206 Z" fill="#d63a5e"/>
      <animateTransform attributeName="transform" type="rotate"
                        values="-3 545 190; 5 545 190; -3 545 190" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ── 近侧曲柄与腿 ─────────────────────────────────────────── -->
  <g id="nearCrank">
    <line id="nearCrankArm" stroke="#8b98a8" stroke-width="8" stroke-linecap="round"/>
    <g id="nearPedal"><rect x="-14" y="-3.5" width="28" height="7" rx="3.5" fill="#3a465c"/></g>
  </g>
  <g id="nearLeg" stroke-linecap="round">
    <line id="nearThighO" stroke="#c9bda4" stroke-width="32"/>
    <line id="nearShinO"  stroke="#c9bda4" stroke-width="24"/>
    <line id="nearThigh"  stroke="#f6efdf" stroke-width="26"/>
    <line id="nearShin"   stroke="#f6efdf" stroke-width="18"/>
  </g>
  <g id="nearFoot">
    <path d="M-7,-2 L24,-2 L32,4 C26,9 12,10 2,8 C-5,7 -9,3 -7,-2 Z"
          fill="#f6efdf" stroke="#c9bda4" stroke-width="2"/>
    <path d="M8,0 L10,7 M18,-1 L20,6" stroke="#c9bda4" stroke-width="1.5"/>
  </g>

  <rect width="1000" height="650" fill="url(#vignette)" pointer-events="none"/>
</svg>

  <!-- ── 费用与 Token 标注 ─────────────────────────────────────── -->
  <div class="hud">
    <div class="hud-card">
      <div class="hud-head">
        <span class="pulse"></span>
        <span class="model">DeepSeek V4.1 Flash 1017</span>
        <span class="badge">估算</span>
      </div>
      <div class="hud-grid">
        <div class="metric">
          <span class="label">Token 用量</span>
          <span class="value">6.53<span class="unit">M</span></span>
          <span class="sub">输入 6.44M · 输出 0.09M</span>
        </div>
        <div class="metric">
          <span class="label">费用</span>
          <span class="value">$0.34</span>
          <span class="sub">≈ ¥2.28</span>
        </div>
      </div>
      <div class="hud-foot">52 轮 LLM 调用 · 按会话日志估算 · 非实际账单</div>
    </div>
  </div>
  <div class="caption">Pelican Bicycle · 2026-10-18</div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const WHEEL_R = 100;
  const WHEEL_REV = 0.52;          // 车轮每秒转数
  const CRANK_REV = 0.72;          // 曲柄每秒转数
  const GROUND = WHEEL_REV * 2 * Math.PI * WHEEL_R;

  const BB = { x: 505, y: 432 };
  const CRANK_R = 40;
  const HIP_N = { x: 450, y: 304 };
  const HIP_F = { x: 466, y: 300 };
  const L1 = 92, L2 = 92;

  const rearSpin = $('rearSpin');
  const frontSpin = $('frontSpin');
  const rider = $('rider');
  const nearCrankArm = $('nearCrankArm');
  const farCrankArm = $('farCrankArm');
  const nearPedal = $('nearPedal');
  const farPedal = $('farPedal');
  const nearFoot = $('nearFoot');
  const farFoot = $('farFoot');
  const nearThigh = $('nearThigh');
  const nearShin = $('nearShin');
  const nearThighO = $('nearThighO');
  const nearShinO = $('nearShinO');
  const farThigh = $('farThigh');
  const farShin = $('farShin');
  const farThighO = $('farThighO');
  const farShinO = $('farShinO');
  const roadMarks = $('roadMarks');
  const grass = $('grass');
  const hillsNear = $('hillsNear');
  const hillsFar = $('hillsFar');
  const chain = $('chain');

  let dist = 0;
  let crank = 0;
  let last = performance.now();

  // 两段式腿部 IK：膝盖朝前弯曲
  function ik(hx, hy, fx, fy) {
    let dx = fx - hx, dy = fy - hy;
    let d = Math.hypot(dx, dy) || 0.001;
    const max = L1 + L2 - 0.5;
    if (d > max) { dx *= max / d; dy *= max / d; d = max; }
    const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    const ux = dx / d, uy = dy / d;
    const mx = hx + ux * a, my = hy + uy * a;
    return { x: mx + uy * h, y: my - ux * h };
  }

  function setLine(el, x1, y1, x2, y2) {
    el.setAttribute('x1', x1.toFixed(2));
    el.setAttribute('y1', y1.toFixed(2));
    el.setAttribute('x2', x2.toFixed(2));
    el.setAttribute('y2', y2.toFixed(2));
  }

  function leg(hip, foot, thigh, shin, thighO, shinO, footEl) {
    const ankle = { x: foot.x, y: foot.y - 9 };
    const knee = ik(hip.x, hip.y, ankle.x, ankle.y);
    setLine(thigh, hip.x, hip.y, knee.x, knee.y);
    setLine(shin, knee.x, knee.y, ankle.x, ankle.y);
    setLine(thighO, hip.x, hip.y, knee.x, knee.y);
    setLine(shinO, knee.x, knee.y, ankle.x, ankle.y);
    footEl.setAttribute('transform', `translate(${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)})`);
  }

  function render() {
    const wheelDeg = (dist / WHEEL_R) * 180 / Math.PI;
    rearSpin.setAttribute('transform', `rotate(${wheelDeg.toFixed(2)} 330 420)`);
    frontSpin.setAttribute('transform', `rotate(${wheelDeg.toFixed(2)} 700 420)`);

    const bob = Math.sin(crank * 2) * 2.2;
    rider.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);

    const p1 = { x: BB.x + Math.cos(crank) * CRANK_R, y: BB.y + Math.sin(crank) * CRANK_R };
    const p2 = { x: BB.x - Math.cos(crank) * CRANK_R, y: BB.y - Math.sin(crank) * CRANK_R };

    setLine(nearCrankArm, BB.x, BB.y, p1.x, p1.y);
    setLine(farCrankArm, BB.x, BB.y, p2.x, p2.y);
    nearPedal.setAttribute('transform', `translate(${p1.x.toFixed(2)} ${p1.y.toFixed(2)})`);
    farPedal.setAttribute('transform', `translate(${p2.x.toFixed(2)} ${p2.y.toFixed(2)})`);

    leg({ x: HIP_N.x, y: HIP_N.y + bob }, p1,
        nearThigh, nearShin, nearThighO, nearShinO, nearFoot);
    leg({ x: HIP_F.x, y: HIP_F.y + bob }, p2,
        farThigh, farShin, farThighO, farShinO, farFoot);

    roadMarks.setAttribute('transform', `translate(${(-(dist % 160)).toFixed(2)} 0)`);
    grass.setAttribute('transform', `translate(${(-(dist % 200)).toFixed(2)} 0)`);
    hillsNear.setAttribute('transform', `translate(${(-((dist * 0.14) % 1000)).toFixed(2)} 0)`);
    hillsFar.setAttribute('transform', `translate(${(-((dist * 0.07) % 1000)).toFixed(2)} 0)`);
    chain.setAttribute('stroke-dashoffset', (-(dist * 0.6) % 9).toFixed(2));
  }

  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduce) {
      dist += GROUND * dt;
      crank += CRANK_REV * 2 * Math.PI * dt;
    }
    render();
    requestAnimationFrame(tick);
  }

  render();
  requestAnimationFrame(tick);
})();
</script>
</body>
