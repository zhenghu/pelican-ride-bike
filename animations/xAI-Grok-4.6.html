<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xAI-Grok-4.6 · 鹈鹕骑自行车</title>
  <style>
    :root {
      --sky-top: #7ec8e3;
      --sky-mid: #c5e8f7;
      --sky-bottom: #f7e8c8;
      --ground: #6bb36b;
      --path: #e8d5a3;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: #1a2a3a;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100%;
      overflow: hidden;
    }

    .stage {
      width: min(1100px, 96vw);
      aspect-ratio: 16 / 9;
      border-radius: 24px;
      overflow: hidden;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-bottom) 72%, #8fbf72 100%);
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .sun {
      transform-origin: 140px 90px;
      animation: sun-pulse 6s ease-in-out infinite;
    }

    .cloud {
      animation: drift 28s linear infinite;
    }

    .cloud-slow {
      animation-duration: 42s;
      animation-delay: -12s;
    }

    .cloud-fast {
      animation-duration: 22s;
      animation-delay: -6s;
    }

    .hill {
      animation: hill-shift 18s ease-in-out infinite alternate;
    }

    .ground-scroll {
      animation: scroll-x 3.2s linear infinite;
    }

    .rider {
      animation: ride-bob 0.42s ease-in-out infinite;
    }

    .body-sway {
      transform-origin: 520px 430px;
      animation: body-sway 0.84s ease-in-out infinite;
    }

    .neck {
      transform-origin: 548px 368px;
      animation: neck-bob 0.84s ease-in-out infinite;
    }

    .head {
      transform-origin: 612px 268px;
      animation: head-nod 0.84s ease-in-out infinite;
    }

    .pouch {
      transform-origin: 638px 292px;
      animation: pouch-wobble 0.84s ease-in-out infinite;
    }

    .wing {
      transform-origin: 500px 390px;
      animation: wing-balance 0.84s ease-in-out infinite;
    }

    .tail {
      transform-origin: 430px 410px;
      animation: tail-wag 0.84s ease-in-out infinite;
    }

    .wheel {
      transform-origin: center;
      animation: spin 0.9s linear infinite;
    }

    .crank {
      transform-origin: 520px 478px;
      animation: spin 0.9s linear infinite;
    }

    .pedal-left, .pedal-right {
      animation: pedal-level 0.9s linear infinite;
    }

    .spoke {
      stroke: #4a5560;
      stroke-width: 2;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      fill: #1d3a4a;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 14px;
      fill: #3d5a6a;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes ride-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes body-sway {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(3deg); }
    }

    @keyframes neck-bob {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(5deg); }
    }

    @keyframes head-nod {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(4deg); }
    }

    @keyframes pouch-wobble {
      0%, 100% { transform: scaleY(1) rotate(-2deg); }
      50% { transform: scaleY(1.08) rotate(3deg); }
    }

    @keyframes wing-balance {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(14deg); }
    }

    @keyframes tail-wag {
      0%, 100% { transform: rotate(8deg); }
      50% { transform: rotate(-10deg); }
    }

    @keyframes pedal-level {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    @keyframes drift {
      from { transform: translateX(-180px); }
      to { transform: translateX(1100px); }
    }

    @keyframes scroll-x {
      from { transform: translateX(0); }
      to { transform: translateX(-160px); }
    }

    @keyframes hill-shift {
      from { transform: translateX(0); }
      to { transform: translateX(-40px); }
    }

    @keyframes sun-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕正在骑自行车">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6ec1e0" />
          <stop offset="55%" stop-color="#d7eef8" />
          <stop offset="100%" stop-color="#f6e3b8" />
        </linearGradient>
        <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffe27a" />
          <stop offset="100%" stop-color="#ffb347" />
        </linearGradient>
        <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8fbf88" />
          <stop offset="100%" stop-color="#6ea36a" />
        </linearGradient>
        <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5f9a5a" />
          <stop offset="100%" stop-color="#3f7a45" />
        </linearGradient>
        <linearGradient id="bodyWhite" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="100%" stop-color="#e8eef3" />
        </linearGradient>
        <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffb347" />
          <stop offset="100%" stop-color="#e8892d" />
        </linearGradient>
        <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f4c27a" />
          <stop offset="100%" stop-color="#d9924a" />
        </linearGradient>
        <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff6b4a" />
          <stop offset="100%" stop-color="#c43b2a" />
        </linearGradient>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1a2a3a" flood-opacity="0.22" />
        </filter>
        <clipPath id="scene">
          <rect width="960" height="540" rx="0" />
        </clipPath>
      </defs>

      <g clip-path="url(#scene)">
        <rect width="960" height="540" fill="url(#sky)" />

        <g class="sun">
          <circle cx="140" cy="90" r="46" fill="url(#sunGlow)" />
          <circle cx="140" cy="90" r="62" fill="#ffe27a" opacity="0.22" />
        </g>

        <g class="cloud cloud-slow" opacity="0.92">
          <ellipse cx="80" cy="70" rx="42" ry="22" fill="#fff" />
          <ellipse cx="112" cy="64" rx="30" ry="20" fill="#fff" />
          <ellipse cx="50" cy="76" rx="24" ry="16" fill="#fff" />
        </g>
        <g class="cloud" opacity="0.85">
          <ellipse cx="40" cy="130" rx="50" ry="24" fill="#fff" />
          <ellipse cx="78" cy="122" rx="32" ry="20" fill="#fff" />
          <ellipse cx="12" cy="136" rx="26" ry="16" fill="#fff" />
        </g>
        <g class="cloud cloud-fast" opacity="0.78">
          <ellipse cx="20" cy="48" rx="36" ry="16" fill="#fff" />
          <ellipse cx="46" cy="44" rx="22" ry="14" fill="#fff" />
        </g>

        <g class="hill">
          <path d="M-40 340 C 80 250, 180 280, 300 320 C 430 365, 520 250, 680 310 C 800 350, 900 280, 1020 330 L 1020 420 L -40 420 Z" fill="url(#hillFar)" opacity="0.7" />
          <path d="M-60 380 C 90 300, 220 360, 360 350 C 520 338, 620 300, 780 350 C 880 380, 960 330, 1040 360 L 1040 450 L -60 450 Z" fill="url(#hillNear)" />
        </g>

        <rect x="0" y="430" width="960" height="110" fill="#4e8f4a" />
        <path d="M0 448 Q 240 430 480 448 T 960 448 L 960 540 L 0 540 Z" fill="#e6c98a" />
        <path d="M0 470 Q 240 458 480 470 T 960 470 L 960 540 L 0 540 Z" fill="#d7b56e" />

        <g class="ground-scroll">
          <g fill="#c9a45a">
            <rect x="0" y="488" width="70" height="8" rx="4" />
            <rect x="160" y="488" width="70" height="8" rx="4" />
            <rect x="320" y="488" width="70" height="8" rx="4" />
            <rect x="480" y="488" width="70" height="8" rx="4" />
            <rect x="640" y="488" width="70" height="8" rx="4" />
            <rect x="800" y="488" width="70" height="8" rx="4" />
            <rect x="960" y="488" width="70" height="8" rx="4" />
            <rect x="1120" y="488" width="70" height="8" rx="4" />
          </g>
          <g fill="#3f7a3c">
            <ellipse cx="40" cy="442" rx="10" ry="6" />
            <ellipse cx="200" cy="438" rx="12" ry="7" />
            <ellipse cx="360" cy="444" rx="9" ry="5" />
            <ellipse cx="520" cy="436" rx="11" ry="6" />
            <ellipse cx="680" cy="442" rx="10" ry="6" />
            <ellipse cx="840" cy="438" rx="12" ry="7" />
            <ellipse cx="1000" cy="444" rx="9" ry="5" />
            <ellipse cx="1160" cy="436" rx="11" ry="6" />
          </g>
        </g>

        <text class="title" x="48" y="48">鹈鹕骑行记</text>
        <text class="subtitle" x="50" y="72">Pelican on a Bicycle</text>

        <g class="rider" filter="url(#softShadow)">
          <!-- rear wheel -->
          <g transform="translate(390 478)">
            <g class="wheel">
              <circle r="54" fill="none" stroke="#2d343c" stroke-width="10" />
              <circle r="48" fill="none" stroke="#8aa0b0" stroke-width="3" />
              <circle r="8" fill="#2d343c" />
              <g class="spoke">
                <line x1="0" y1="-46" x2="0" y2="46" />
                <line x1="-46" y1="0" x2="46" y2="0" />
                <line x1="-32" y1="-32" x2="32" y2="32" />
                <line x1="32" y1="-32" x2="-32" y2="32" />
              </g>
            </g>
            <circle r="54" fill="none" stroke="#1a2228" stroke-width="4" opacity="0.25" />
          </g>

          <!-- front wheel -->
          <g transform="translate(670 478)">
            <g class="wheel">
              <circle r="54" fill="none" stroke="#2d343c" stroke-width="10" />
              <circle r="48" fill="none" stroke="#8aa0b0" stroke-width="3" />
              <circle r="8" fill="#2d343c" />
              <g class="spoke">
                <line x1="0" y1="-46" x2="0" y2="46" />
                <line x1="-46" y1="0" x2="46" y2="0" />
                <line x1="-32" y1="-32" x2="32" y2="32" />
                <line x1="32" y1="-32" x2="-32" y2="32" />
              </g>
            </g>
          </g>

          <!-- bicycle frame -->
          <g stroke="url(#frame)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <path d="M390 478 L 470 360 L 600 360 L 670 478" />
            <path d="M470 360 L 520 478" />
            <path d="M520 478 L 600 360" />
            <path d="M600 360 L 628 318" />
          </g>
          <circle cx="390" cy="478" r="10" fill="#2d343c" />
          <circle cx="670" cy="478" r="10" fill="#2d343c" />
          <circle cx="520" cy="478" r="9" fill="#2d343c" />

          <!-- seat -->
          <path d="M448 352 C 458 342, 492 340, 508 352 C 500 362, 456 362, 448 352 Z" fill="#2d343c" />
          <path d="M470 360 L 476 350" stroke="#2d343c" stroke-width="6" stroke-linecap="round" />

          <!-- handlebar -->
          <path d="M628 318 C 640 300, 668 298, 686 312" fill="none" stroke="#2d343c" stroke-width="8" stroke-linecap="round" />
          <rect x="678" y="304" width="22" height="10" rx="5" fill="#f0d9a0" transform="rotate(-18 689 309)" />

          <!-- crank + pedals + feet -->
          <g class="crank">
            <line x1="520" y1="478" x2="520" y2="430" stroke="#2d343c" stroke-width="7" stroke-linecap="round" />
            <line x1="520" y1="478" x2="520" y2="526" stroke="#2d343c" stroke-width="7" stroke-linecap="round" />

            <g transform="translate(520 430)">
              <g class="pedal-left">
                <rect x="-16" y="-6" width="32" height="12" rx="4" fill="#3a4450" />
                <!-- webbed foot on top pedal -->
                <ellipse cx="2" cy="-10" rx="16" ry="8" fill="#f4c27a" />
                <path d="M-10 -10 Q -16 -18 -8 -16 Q 2 -22 12 -16 Q 18 -18 14 -10 Z" fill="#e8a85a" />
              </g>
            </g>

            <g transform="translate(520 526)">
              <g class="pedal-right">
                <rect x="-16" y="-6" width="32" height="12" rx="4" fill="#3a4450" />
                <ellipse cx="-2" cy="-8" rx="16" ry="8" fill="#f4c27a" />
                <path d="M-14 -8 Q -20 -16 -10 -14 Q 0 -20 10 -14 Q 16 -16 12 -8 Z" fill="#e8a85a" />
              </g>
            </g>
          </g>

          <!-- pelican -->
          <g class="body-sway">
            <!-- tail -->
            <g class="tail">
              <path d="M430 410 Q 390 400 368 418 Q 392 430 430 424 Z" fill="#f2c14e" />
              <path d="M428 416 Q 396 412 380 424" fill="none" stroke="#e0a83a" stroke-width="2" />
            </g>

            <!-- far wing -->
            <path d="M490 392 Q 430 350 404 372 Q 430 386 488 404 Z" fill="#dfe7ee" />

            <!-- body -->
            <ellipse cx="508" cy="400" rx="78" ry="52" fill="url(#bodyWhite)" />
            <ellipse cx="500" cy="412" rx="50" ry="28" fill="#f4c27a" opacity="0.35" />

            <!-- near wing -->
            <g class="wing">
              <path d="M500 390 Q 430 330 390 368 Q 410 392 448 392 Q 470 410 508 404 Z" fill="#ffffff" stroke="#d5dee6" stroke-width="2" />
              <path d="M470 372 Q 430 352 410 368" fill="none" stroke="#c9d4de" stroke-width="2" />
              <path d="M482 384 Q 446 368 424 382" fill="none" stroke="#c9d4de" stroke-width="2" />
            </g>

            <!-- legs to pedals -->
            <path d="M500 440 Q 508 458 520 430" fill="none" stroke="#f4c27a" stroke-width="10" stroke-linecap="round" />
            <path d="M530 442 Q 528 470 520 526" fill="none" stroke="#f4c27a" stroke-width="10" stroke-linecap="round" />

            <!-- neck -->
            <g class="neck">
              <path d="M548 368 C 560 330, 548 300, 572 272 C 586 256, 610 258, 622 270" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
              <path d="M548 368 C 560 330, 548 300, 572 272 C 586 256, 610 258, 622 270" fill="none" stroke="#eef3f7" stroke-width="8" stroke-linecap="round" />

              <!-- head + beak -->
              <g class="head">
                <ellipse cx="628" cy="262" rx="28" ry="24" fill="#ffffff" />
                <circle cx="636" cy="256" r="5.5" fill="#1a2228" />
                <circle cx="638" cy="254" r="2" fill="#fff" />
                <path d="M618 248 Q 624 236 638 240" fill="none" stroke="#1a2228" stroke-width="2" stroke-linecap="round" />

                <g class="pouch">
                  <path d="M650 268 C 668 268, 708 278, 742 292 C 708 328, 662 330, 638 304 C 628 292, 632 274, 650 268 Z" fill="url(#pouchGrad)" />
                  <path d="M650 268 C 680 272, 720 282, 742 292" fill="none" stroke="#c77832" stroke-width="3" />
                </g>

                <path d="M648 262 L 746 286 Q 742 296 650 276 Z" fill="url(#beak)" />
                <path d="M650 268 L 742 292" stroke="#c77832" stroke-width="2" />
              </g>
            </g>

            <!-- wing holding handlebar -->
            <path d="M560 392 Q 610 350 678 312" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
            <path d="M560 392 Q 610 350 678 312" fill="none" stroke="#dfe7ee" stroke-width="4" stroke-linecap="round" />
            <ellipse cx="682" cy="312" rx="10" ry="7" fill="#f4c27a" transform="rotate(-20 682 312)" />
          </g>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
