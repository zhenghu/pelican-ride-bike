<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root {
    --sky-top: #7fd4ff;
    --sky-bottom: #ffe9b8;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: radial-gradient(circle at 50% 0%, #14203a 0%, #070a14 70%);
    font-family: "Avenir Next", "PingFang SC", system-ui, sans-serif;
    color: #e8eefc;
    padding: 24px;
  }

  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.12em;
  }

  .hint {
    margin: 0;
    font-size: 13px;
    opacity: 0.6;
  }

  .stage {
    width: min(960px, 100%);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08);
    background: #0b1020;
  }

  svg { display: block; width: 100%; height: auto; }

  /* ---------- 动画 ---------- */
  @keyframes spin { to { transform: rotate(360deg); } }

  @keyframes drift {
    from { transform: translateX(900px); }
    to   { transform: translateX(-320px); }
  }

  @keyframes scroll-road {
    from { transform: translateX(0); }
    to   { transform: translateX(-120px); }
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-0.6deg); }
    50%      { transform: translateY(-4px) rotate(0.6deg); }
  }

  @keyframes flap {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(16deg); }
  }

  @keyframes pouch-jiggle {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(1.12); }
  }

  @keyframes scarf-wave {
    0%, 100% { transform: rotate(-4deg) skewX(0deg); }
    50%      { transform: rotate(6deg) skewX(-6deg); }
  }

  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.05); }
  }

  @keyframes speedline {
    from { transform: translateX(260px); opacity: 0; }
    20%  { opacity: 0.9; }
    to   { transform: translateX(-620px); opacity: 0; }
  }

  #wheel-rear  { animation: spin 0.9s linear infinite; transform-origin: 300px 335px; }
  #wheel-front { animation: spin 0.9s linear infinite; transform-origin: 470px 335px; }

  #bike-and-rider { animation: bob 0.45s ease-in-out infinite; transform-origin: 385px 335px; }

  #wing { animation: flap 0.45s ease-in-out infinite; transform-origin: 356px 206px; }
  #pouch { animation: pouch-jiggle 0.45s ease-in-out infinite; transform-origin: 470px 156px; }
  #scarf { animation: scarf-wave 0.6s ease-in-out infinite; transform-origin: 420px 186px; }
  #eyelid { animation: blink 4.2s ease-in-out infinite; transform-origin: 452px 146px; }

  .cloud { animation: drift linear infinite; }
  .cloud--a { animation-duration: 16s; }
  .cloud--b { animation-duration: 23s; animation-delay: -6s; }
  .cloud--c { animation-duration: 30s; animation-delay: -14s; }

  #road-marks { animation: scroll-road 0.35s linear infinite; }
  #hills-far  { animation: drift 46s linear infinite; }

  .speedline { animation: speedline 0.7s linear infinite; }
  .speedline:nth-of-type(2) { animation-delay: 0.18s; animation-duration: 0.62s; }
  .speedline:nth-of-type(3) { animation-delay: 0.36s; animation-duration: 0.8s; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
  <h1>PELICAN ON A BICYCLE</h1>

  <div class="stage">
    <svg id="scene" viewBox="0 0 800 450" role="img" aria-label="一只戴头盔的鹈鹕骑着自行车向前飞驰的动画">

            <line x1="385" y1="332" x2="452" y2="290" />
            <line x1="352" y1="252" x2="450" y2="262" />
            <line x1="385" y1="332" x2="300" y2="335" />
            <line x1="352" y1="252" x2="300" y2="335" />
          </g>
          <g stroke="#b62b44" stroke-width="7" stroke-linecap="round" fill="none">

            <line x1="455" y1="292" x2="470" y2="335" />

        <!-- ===== 后腿（远侧） ===== -->

          <line class="thigh" stroke-width="13" x1="352" y1="252" x2="370" y2="300" />
          <line class="shin"  stroke-width="10" x1="370" y1="300" x2="385" y2="354" />
          <line class="foot"  stroke-width="8"  stroke="#e08a2a" x1="385" y1="354" x2="402" y2="354" />

        <!-- ===== 鹈鹕身体 ===== -->

          <!-- 身体 -->

          <!-- 胸腹阴影 -->

          <!-- 脖子 -->

          <!-- 围巾 -->

            <path d="M414 186 q-30 6 -54 26 q26 2 40 -6 q10 -6 14 -20 z" fill="#3ec9b5" stroke="#1f9d8c" stroke-width="2" />
          </g>

          <!-- 头 -->
          <ellipse cx="452" cy="152" rx="26" ry="23" fill="url(#bodyGrad)" stroke="#a9b6c7" stroke-width="2.5" />

          <!-- 喉袋 -->
          <path id="pouch" d="M466 152 q46 4 64 16 q-8 22 -38 20 q-24 -2 -30 -18 z" fill="url(#pouchGrad)" stroke="#d8631f" stroke-width="2.5" />
          <!-- 袋里的小鱼 -->

            <path d="M8 0 l8 -5 l0 10 z" fill="#8fd8ff" stroke="#3f9fd0" stroke-width="1.5" />

        <!-- ===== 前腿（近侧） ===== -->

  <p class="hint">纯 SVG + CSS 动画，腿部由两段式 IK 逆向运动学实时驱动（不依赖任何外部资源）</p>

<script>
(() => {
  const HIP = { x: 352, y: 252 };     // 髋关节
  const CRANK = { x: 385, y: 332 };   // 五通中心
  const CRANK_R = 22;                 // 曲柄长度
  const THIGH = 62, SHIN = 62;        // 大腿 / 小腿长度
  const RPM_PERIOD = 0.9;             // 与车轮 CSS 动画周期一致（秒）

  const legs = {
    near: document.getElementById('leg-near'),
    far: document.getElementById('leg-far'),
  };
  const parts = Object.fromEntries(Object.entries(legs).map(([k, g]) => [k, {
    thigh: g.querySelector('.thigh'),
    shin: g.querySelector('.shin'),
    foot: g.querySelector('.foot'),
  }]));

  const crankArmA = document.getElementById('crank-arm-a');
  const crankArmB = document.getElementById('crank-arm-b');
  const pedalA = document.getElementById('pedal-a');
  const pedalB = document.getElementById('pedal-b');

  /** 踏板位置 */
  const pedalPos = (angle) => ({
    x: CRANK.x + CRANK_R * Math.cos(angle),
    y: CRANK.y + CRANK_R * Math.sin(angle),
  });

  /** 两段式 IK：求膝关节位置，膝盖朝前（+x） */
  function knee(hip, foot) {
    const dx = foot.x - hip.x;
    const dy = foot.y - hip.y;
    const d = Math.min(Math.hypot(dx, dy), THIGH + SHIN - 0.001) || 0.001;
    const ux = dx / d, uy = dy / d;
    const a = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, THIGH * THIGH - a * a));
    // 法向量 (uy, -ux) 指向前上方，使膝盖自然朝前弯
    return { x: hip.x + a * ux + h * uy, y: hip.y + a * uy - h * ux };
  }

  function setLine(el, p1, p2) {
    el.setAttribute('x1', p1.x.toFixed(2));
    el.setAttribute('y1', p1.y.toFixed(2));
    el.setAttribute('x2', p2.x.toFixed(2));
    el.setAttribute('y2', p2.y.toFixed(2));
  }

  function drawLeg(p, angle) {
    const foot = pedalPos(angle);
    const k = knee(HIP, foot);
    setLine(p.thigh, HIP, k);
    setLine(p.shin, k, foot);
    // 脚掌朝前，随踩踏轻微摆动
    const toe = { x: foot.x + 18, y: foot.y - 2 + 3 * Math.sin(angle) };
    setLine(p.foot, foot, toe);
  }

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let start = null;

  function frame(now) {
    if (start === null) start = now;
    const t = (now - start) / 1000;
    const angle = reduced ? 0.6 : (t / RPM_PERIOD) * Math.PI * 2;

    // 曲柄臂
    const pa = pedalPos(angle);
    const pb = pedalPos(angle + Math.PI);
    setLine(crankArmA, CRANK, pa);
    setLine(crankArmB, CRANK, pb);
    // 踏板始终保持水平
    pedalA.setAttribute('transform', `translate(${pa.x.toFixed(2)} ${pa.y.toFixed(2)})`);
    pedalB.setAttribute('transform', `translate(${pb.x.toFixed(2)} ${pb.y.toFixed(2)})`);

    drawLeg(parts.near, angle);
    drawLeg(parts.far, angle + Math.PI);

    if (!reduced) requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
