<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anthropic-ClaudeOpus-4.8 · 鹈鹕骑自行车</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #7ec8f0 0%, #b6e3ff 55%, #d9f2ff 100%);
  }
  h1 {
    color: #0c4a6e;
    font-size: clamp(1.2rem, 3vw, 2rem);
    margin-bottom: 12px;
    letter-spacing: 2px;
    text-shadow: 0 2px 6px rgba(255,255,255,0.6);
  }
  .stage {
    width: min(92vw, 900px);
    aspect-ratio: 16 / 9;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(12, 74, 110, 0.35);
    background: transparent;
  }
  svg { width: 100%; height: 100%; display: block; }

  /* ---- 动画定义 ---- */

  /* 云朵飘动 */
  .cloud { animation: cloudMove 24s linear infinite; }
  .cloud.c2 { animation-duration: 34s; }
  .cloud.c3 { animation-duration: 44s; }
  @keyframes cloudMove {
    from { transform: translateX(1050px); }
    to   { transform: translateX(-350px); }
  }

  /* 地面滚动的路面标线 */
  .road-dash { animation: dashMove 0.55s linear infinite; }
  @keyframes dashMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-120px); }
  }

  /* 背景灌木快速掠过 */
  .bush { animation: bushMove 2.4s linear infinite; }
  .bush.b2 { animation-duration: 3.2s; }
  .bush.b3 { animation-duration: 4s; }
  @keyframes bushMove {
    from { transform: translateX(1000px); }
    to   { transform: translateX(-200px); }
  }

  /* 轮子旋转 */
  .wheel-spin { animation: spin 0.55s linear infinite; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 踏板旋转（与轮子同步） */
  .pedals { animation: spin 0.55s linear infinite; transform-origin: center; }

  /* 整只鹈鹕 + 车身上下颠簸 */
  .rider { animation: bounce 0.55s ease-in-out infinite; transform-origin: center; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }

  /* 左右两条腿交替踩踏 */
  .leg-front { animation: legFront 0.55s linear infinite; transform-origin: 0 0; }
  .leg-back  { animation: legBack 0.55s linear infinite; transform-origin: 0 0; }
  @keyframes legFront {
    0%   { transform: rotate(0deg); }
    50%  { transform: rotate(28deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes legBack {
    0%   { transform: rotate(28deg); }
    50%  { transform: rotate(0deg); }
    100% { transform: rotate(28deg); }
  }

  /* 喙微微开合 */
  .lower-beak { animation: beak 1.6s ease-in-out infinite; transform-origin: 512px 196px; }
  @keyframes beak {
    0%, 90%, 100% { transform: rotate(0deg); }
    95%           { transform: rotate(8deg); }
  }

  /* 太阳光晕呼吸 */
  .sun-glow { animation: glow 4s ease-in-out infinite; transform-origin: center; }
  @keyframes glow {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%      { opacity: 0.85; transform: scale(1.08); }
  }
</style>
</head>
<body>
  <h1>🐦 鹈鹕骑自行车 🚲</h1>
  <div class="stage">
    <svg viewBox="0 0 1000 562" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#79c6f2"/>
          <stop offset="60%" stop-color="#bfe7ff"/>
          <stop offset="100%" stop-color="#e4f6ff"/>
        </linearGradient>
        <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#8fd28a"/>
          <stop offset="100%" stop-color="#5cae62"/>
        </linearGradient>
        <radialGradient id="sunG" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stop-color="#fff6b0"/>
          <stop offset="100%" stop-color="#ffd83b"/>
        </radialGradient>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#e8eef5"/>
        </linearGradient>
      </defs>

      <!-- 天空 -->
      <rect x="0" y="0" width="1000" height="562" fill="url(#sky)"/>

      <!-- 太阳 -->
      <g transform="translate(120,110)">
        <circle class="sun-glow" r="70" fill="#ffec8a" opacity="0.6"/>
        <circle r="46" fill="url(#sunG)"/>
      </g>

      <!-- 云朵 -->
      <g class="cloud c1" fill="#ffffff" opacity="0.95">
        <g transform="translate(-200,90)">
          <ellipse cx="0"  cy="0"  rx="42" ry="28"/>
          <ellipse cx="40" cy="8"  rx="52" ry="34"/>
          <ellipse cx="88" cy="0"  rx="40" ry="26"/>
        </g>
      </g>
      <g class="cloud c2" fill="#ffffff" opacity="0.9">
        <g transform="translate(-200,170)">
          <ellipse cx="0"  cy="0"  rx="34" ry="22"/>
          <ellipse cx="34" cy="6"  rx="44" ry="28"/>
          <ellipse cx="74" cy="0"  rx="32" ry="20"/>
        </g>
      </g>
      <g class="cloud c3" fill="#ffffff" opacity="0.85">
        <g transform="translate(-200,50)">
          <ellipse cx="0"  cy="0"  rx="28" ry="18"/>
          <ellipse cx="28" cy="5"  rx="36" ry="24"/>
          <ellipse cx="62" cy="0"  rx="26" ry="16"/>
        </g>
      </g>

      <!-- 地面 -->
      <rect x="0" y="430" width="1000" height="132" fill="url(#ground)"/>

      <!-- 背景灌木（快速掠过） -->
      <g fill="#4a9e52">
        <g class="bush b1"><circle cx="0" cy="425" r="26"/><circle cx="24" cy="425" r="20"/><circle cx="-22" cy="425" r="18"/></g>
        <g class="bush b2"><circle cx="0" cy="425" r="20"/><circle cx="20" cy="425" r="16"/></g>
        <g class="bush b3"><circle cx="0" cy="425" r="30"/><circle cx="30" cy="425" r="22"/><circle cx="-26" cy="425" r="20"/></g>
      </g>

      <!-- 马路 -->
      <rect x="0" y="470" width="1000" height="30" fill="#5a5f66"/>
      <!-- 滚动虚线 -->
      <g class="road-dash" fill="#f3d34a">
        <rect x="0"   y="482" width="60" height="7" rx="3"/>
        <rect x="120" y="482" width="60" height="7" rx="3"/>
        <rect x="240" y="482" width="60" height="7" rx="3"/>
        <rect x="360" y="482" width="60" height="7" rx="3"/>
        <rect x="480" y="482" width="60" height="7" rx="3"/>
        <rect x="600" y="482" width="60" height="7" rx="3"/>
        <rect x="720" y="482" width="60" height="7" rx="3"/>
        <rect x="840" y="482" width="60" height="7" rx="3"/>
        <rect x="960" y="482" width="60" height="7" rx="3"/>
        <rect x="1080" y="482" width="60" height="7" rx="3"/>
      </g>

      <!-- ============ 骑手 + 自行车（整体颠簸） ============ -->
      <g class="rider">
        <!-- 自行车 -->
        <g stroke="#c0392b" stroke-width="7" fill="none" stroke-linecap="round">
          <!-- 后轮 -->
          <g transform="translate(410,410)">
            <circle r="60" stroke="#2c3e50" stroke-width="8" fill="#eef2f5"/>
            <g class="wheel-spin" stroke="#7f8c8d" stroke-width="3">
              <line x1="-60" y1="0" x2="60" y2="0"/>
              <line x1="0" y1="-60" x2="0" y2="60"/>
              <line x1="-42" y1="-42" x2="42" y2="42"/>
              <line x1="-42" y1="42" x2="42" y2="-42"/>
            </g>
            <circle r="7" fill="#2c3e50" stroke="none"/>
          </g>
          <!-- 前轮 -->
          <g transform="translate(610,410)">
            <circle r="60" stroke="#2c3e50" stroke-width="8" fill="#eef2f5"/>
            <g class="wheel-spin" stroke="#7f8c8d" stroke-width="3">
              <line x1="-60" y1="0" x2="60" y2="0"/>
              <line x1="0" y1="-60" x2="0" y2="60"/>
              <line x1="-42" y1="-42" x2="42" y2="42"/>
              <line x1="-42" y1="42" x2="42" y2="-42"/>
            </g>
            <circle r="7" fill="#2c3e50" stroke="none"/>
          </g>
          <!-- 车架 -->
          <line x1="410" y1="410" x2="510" y2="410"/>  <!-- 下管到中轴 -->
          <line x1="510" y1="410" x2="610" y2="410"/>  <!-- 中轴到前轮 -->
          <line x1="410" y1="410" x2="500" y2="330"/>  <!-- 座管 -->
          <line x1="510" y1="410" x2="500" y2="330"/>  <!-- 立管 -->
          <line x1="500" y1="330" x2="600" y2="340"/>  <!-- 上管 -->
          <!-- 前叉 & 车头 -->
          <line x1="600" y1="340" x2="610" y2="410"/>
          <line x1="600" y1="340" x2="640" y2="318"/>  <!-- 车把 -->
          <!-- 座垫 -->
          <path d="M478 326 q22 -10 44 0" stroke="#2c3e50" stroke-width="10"/>
        </g>

        <!-- 曲柄 + 踏板（在中轴 510,410 旋转） -->
        <g class="pedals" transform="translate(510,410)" stroke="#2c3e50" stroke-width="6" fill="none" stroke-linecap="round">
          <line x1="0" y1="0" x2="0" y2="30"/>
          <line x1="0" y1="0" x2="0" y2="-30"/>
          <rect x="-12" y="28" width="24" height="7" rx="3" fill="#34495e" stroke="none"/>
          <rect x="-12" y="-35" width="24" height="7" rx="3" fill="#34495e" stroke="none"/>
        </g>

        <!-- ============ 鹈鹕 ============ -->
        <g>
          <!-- 后腿（先画，被身体遮住上部） -->
          <g class="leg-back" transform="translate(505,352)">
            <line x1="0" y1="0" x2="4" y2="58" stroke="#f5a623" stroke-width="11" stroke-linecap="round"/>
            <path d="M0 58 l14 6 l-4 6 l-14 -4 z" fill="#f5a623"/>
          </g>

          <!-- 身体 -->
          <ellipse cx="490" cy="300" rx="86" ry="66" fill="url(#body)" stroke="#d0d8e0" stroke-width="2"/>
          <!-- 翅膀 -->
          <path d="M470 285 q-70 10 -96 46 q40 6 70 -8 q22 -10 40 -20 z" fill="#dfe7ef" stroke="#c3ccd6" stroke-width="2"/>

          <!-- 脖子 & 头 -->
          <path d="M540 270 q40 -30 30 -78 q-4 -24 -28 -30" fill="none" stroke="url(#body)" stroke-width="34" stroke-linecap="round"/>
          <path d="M540 270 q40 -30 30 -78 q-4 -24 -28 -30" fill="none" stroke="#e2e9f1" stroke-width="34" stroke-linecap="round" opacity="0.5"/>

          <!-- 头部 -->
          <g>
            <circle cx="548" cy="168" r="34" fill="url(#body)" stroke="#d0d8e0" stroke-width="2"/>
            <!-- 眼睛 -->
            <circle cx="562" cy="160" r="6.5" fill="#2c3e50"/>
            <circle cx="564" cy="158" r="2" fill="#ffffff"/>

            <!-- 上喙 -->
            <path d="M578 162 q70 -6 108 8 q-6 12 -26 14 q-46 4 -80 0 z" fill="#ffb733" stroke="#e69412" stroke-width="2"/>
            <!-- 下喙 + 喉囊（会开合） -->
            <g class="lower-beak">
              <path d="M578 178 q60 6 96 22 q-14 20 -50 20 q-40 0 -58 -22 q-4 -12 12 -20 z" fill="#ffce6b" stroke="#e6a92b" stroke-width="2"/>
              <path d="M584 182 q46 8 76 24 q-18 12 -46 10 q-28 -2 -42 -18 z" fill="#ffe4a3"/>
            </g>
          </g>

          <!-- 头顶小羽冠 -->
          <path d="M528 140 q6 -18 22 -22 q-4 12 -6 22 z" fill="#dfe7ef"/>

          <!-- 前腿（后画，在最上层踩前踏板） -->
          <g class="leg-front" transform="translate(510,352)">
            <line x1="0" y1="0" x2="0" y2="30" stroke="#f5a623" stroke-width="12" stroke-linecap="round"/>
            <path d="M0 30 l16 6 l-4 7 l-16 -4 z" fill="#f5a623"/>
          </g>
        </g>
      </g>

    </svg>
  </div>
</body>
</html>
