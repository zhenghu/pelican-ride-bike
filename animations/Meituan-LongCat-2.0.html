<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Meituan-LongCat-2.0 · 鹈鹕骑自行车</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(180deg, #87ceeb 0%, #b0e0e6 60%, #98fb98 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    svg {
      width: 800px;
      height: 500px;
    }

    /* 车轮旋转 */
    .wheel {
      transform-origin: center;
      animation: spin 0.6s linear infinite;
    }
    .wheel-back { transform-origin: 180px 300px; }
    .wheel-front { transform-origin: 420px 300px; }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* 车身整体前进 + 轻微颠簸 */
    .bike-group {
      animation: move 0.3s ease-in-out infinite alternate;
    }
    @keyframes move {
      from { transform: translateY(0); }
      to   { transform: translateY(-4px); }
    }

    /* 翅膀扇动 */
    .wing {
      transform-origin: 300px 200px;
      animation: flap 0.4s ease-in-out infinite alternate;
    }
    @keyframes flap {
      from { transform: rotate(-15deg); }
      to   { transform: rotate(10deg); }
    }

    /* 嘴巴张合 */
    .beak-lower {
      transform-origin: 390px 175px;
      animation: beakChomp 1.2s ease-in-out infinite;
    }
    @keyframes beakChomp {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(8deg); }
    }

    /* 尾巴摆动 */
    .tail {
      transform-origin: 240px 195px;
      animation: tailWag 0.8s ease-in-out infinite alternate;
    }
    @keyframes tailWag {
      from { transform: rotate(-5deg); }
      to   { transform: rotate(5deg); }
    }

    /* 云朵飘动 */
    .cloud-1 { animation: drift 12s linear infinite; }
    .cloud-2 { animation: drift 18s linear infinite; }
    .cloud-3 { animation: drift 15s linear infinite; }
    @keyframes drift {
      from { transform: translateX(0); }
      to   { transform: translateX(820px); }
    }

    /* 太阳光晕 */
    .sun-glow {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.6; r: 38; }
      to   { opacity: 0.9; r: 42; }
    }
  </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">

  <!-- ===== 背景 ===== -->
  <!-- 太阳 -->
  <circle cx="680" cy="80" r="35" fill="#FFD700" />
  <circle class="sun-glow" cx="680" cy="80" r="38" fill="#FFD700" opacity="0.5" />

  <!-- 云朵 -->
  <g class="cloud-1" transform="translate(-120, 60)">
    <ellipse cx="0" cy="0" rx="40" ry="20" fill="white" opacity="0.9"/>
    <ellipse cx="30" cy="-8" rx="30" ry="18" fill="white" opacity="0.9"/>
    <ellipse cx="-25" cy="-5" rx="25" ry="15" fill="white" opacity="0.9"/>
  </g>
  <g class="cloud-2" transform="translate(-200, 100)">
    <ellipse cx="0" cy="0" rx="35" ry="18" fill="white" opacity="0.85"/>
    <ellipse cx="28" cy="-6" rx="28" ry="16" fill="white" opacity="0.85"/>
    <ellipse cx="-20" cy="-4" rx="22" ry="13" fill="white" opacity="0.85"/>
  </g>
  <g class="cloud-3" transform="translate(-160, 35)">
    <ellipse cx="0" cy="0" rx="30" ry="15" fill="white" opacity="0.8"/>
    <ellipse cx="22" cy="-5" rx="24" ry="14" fill="white" opacity="0.8"/>
  </g>

  <!-- 地面 -->
  <rect x="0" y="340" width="800" height="160" fill="#7ec850"/>
  <rect x="0" y="335" width="800" height="10" fill="#5da83a"/>

  <!-- 远处小山 -->
  <ellipse cx="150" cy="340" rx="120" ry="40" fill="#6ab84a" opacity="0.6"/>
  <ellipse cx="600" cy="340" rx="100" ry="35" fill="#6ab84a" opacity="0.5"/>

  <!-- ===== 自行车 + 鹈鹕 ===== -->
  <g class="bike-group">

    <!-- 后轮 -->
    <g class="wheel wheel-back">
      <circle cx="180" cy="300" r="50" fill="none" stroke="#333" stroke-width="4"/>
      <circle cx="180" cy="300" r="3" fill="#333"/>
      <!-- 辐条 -->
      <line x1="180" y1="250" x2="180" y2="350" stroke="#888" stroke-width="1.5"/>
      <line x1="130" y1="300" x2="230" y2="300" stroke="#888" stroke-width="1.5"/>
      <line x1="145" y1="265" x2="215" y2="335" stroke="#888" stroke-width="1.5"/>
      <line x1="215" y1="265" x2="145" y2="335" stroke="#888" stroke-width="1.5"/>
    </g>

    <!-- 前轮 -->
    <g class="wheel wheel-front">
      <circle cx="420" cy="300" r="50" fill="none" stroke="#333" stroke-width="4"/>
      <circle cx="420" cy="300" r="3" fill="#333"/>
      <line x1="420" y1="250" x2="420" y2="350" stroke="#888" stroke-width="1.5"/>
      <line x1="370" y1="300" x2="470" y2="300" stroke="#888" stroke-width="1.5"/>
      <line x1="385" y1="265" x2="455" y2="335" stroke="#888" stroke-width="1.5"/>
      <line x1="455" y1="265" x2="385" y2="335" stroke="#888" stroke-width="1.5"/>
    </g>

    <!-- 车架 -->
    <line x1="180" y1="300" x2="280" y2="220" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
    <line x1="280" y1="220" x2="420" y2="300" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
    <line x1="280" y1="220" x2="300" y2="300" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
    <line x1="300" y1="300" x2="420" y2="300" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
    <!-- 后下叉 -->
    <line x1="180" y1="300" x2="300" y2="300" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>

    <!-- 座管 -->
    <line x1="280" y1="220" x2="290" y2="195" stroke="#555" stroke-width="4" stroke-linecap="round"/>
    <!-- 车座 -->
    <ellipse cx="290" cy="192" rx="18" ry="6" fill="#333"/>

    <!-- 前叉 -->
    <line x1="420" y1="300" x2="410" y2="220" stroke="#555" stroke-width="3" stroke-linecap="round"/>
    <!-- 车把 -->
    <line x1="400" y1="210" x2="420" y2="220" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    <line x1="395" y1="205" x2="405" y2="215" stroke="#333" stroke-width="3" stroke-linecap="round"/>

    <!-- 脚踏板曲柄 -->
    <circle cx="300" cy="300" r="6" fill="#555"/>
    <g class="wheel" style="transform-origin: 300px 300px;">
      <line x1="300" y1="300" x2="315" y2="312" stroke="#555" stroke-width="3"/>
      <rect x="312" y="309" width="10" height="5" rx="2" fill="#333"/>
      <line x1="300" y1="300" x2="285" y2="288" stroke="#555" stroke-width="3"/>
      <rect x="275" y="285" width="10" height="5" rx="2" fill="#333"/>
    </g>

    <!-- ===== 鹈鹕 ===== -->
    <!-- 身体 -->
    <ellipse cx="290" cy="170" rx="35" ry="28" fill="#F5F5DC"/>
    <ellipse cx="290" cy="170" rx="33" ry="26" fill="#FFFDD0"/>

    <!-- 尾巴 -->
    <g class="tail">
      <path d="M 258 185 Q 240 175 235 165 Q 245 170 255 178 Z" fill="#E8DCC8"/>
      <path d="M 255 180 Q 238 168 232 160" stroke="#C4B89C" stroke-width="2" fill="none"/>
    </g>

    <!-- 翅膀 -->
    <g class="wing">
      <path d="M 275 165 Q 260 140 270 120 Q 285 135 290 155 Z" fill="#E8DCC8" stroke="#C4B89C" stroke-width="1"/>
      <path d="M 278 160 Q 265 142 274 125" stroke="#C4B89C" stroke-width="1" fill="none"/>
    </g>

    <!-- 脖子 -->
    <path d="M 310 160 Q 320 140 330 130 Q 335 145 325 165 Z" fill="#FFFDD0" stroke="#E8DCC8" stroke-width="1"/>

    <!-- 头 -->
    <ellipse cx="335" cy="135" rx="20" ry="16" fill="#FFFDD0"/>
    <ellipse cx="335" cy="135" rx="18" ry="14" fill="#FFF8DC"/>

    <!-- 眼睛 -->
    <circle cx="342" cy="130" r="4" fill="white"/>
    <circle cx="343" cy="130" r="2.5" fill="#333"/>
    <circle cx="344" cy="129" r="1" fill="white"/>

    <!-- 上喙 -->
    <path d="M 350 135 Q 380 132 400 138 Q 395 142 380 143 Q 360 144 350 140 Z"
          fill="#F4A460" stroke="#D4914A" stroke-width="1"/>
    <!-- 下喙 -->
    <g class="beak-lower">
      <path d="M 350 140 Q 375 148 398 142 Q 390 148 375 150 Q 358 150 350 144 Z"
            fill="#E8994A" stroke="#D4914A" stroke-width="1"/>
    </g>
    <!-- 喉囊 -->
    <path d="M 350 143 Q 365 160 355 175 Q 345 168 348 150 Z"
          fill="#FFB347" opacity="0.7" stroke="#E8994A" stroke-width="0.5"/>

    <!-- 腿 -->
    <line x1="295" y1="195" x2="305" y2="220" stroke="#D4914A" stroke-width="3" stroke-linecap="round"/>
    <line x1="285" y1="195" x2="295" y2="220" stroke="#D4914A" stroke-width="3" stroke-linecap="round"/>
    <!-- 脚踩脚踏 -->
    <ellipse cx="308" cy="222" rx="6" ry="3" fill="#D4914A"/>
    <ellipse cx="292" cy="222" rx="6" ry="3" fill="#D4914A"/>

    <!-- 帽子（装饰） -->
    <path d="M 320 118 Q 335 108 350 118" fill="#2c3e50" stroke="#1a252f" stroke-width="1"/>
    <rect x="318" y="116" width="34" height="5" rx="2" fill="#2c3e50"/>
    <circle cx="335" cy="112" r="3" fill="#e74c3c"/>
  </g>

  <!-- 速度线 -->
  <line x1="100" y1="260" x2="60" y2="260" stroke="white" stroke-width="2" opacity="0.5">
    <animate attributeName="x1" from="100" to="20" dur="0.4s" repeatCount="indefinite"/>
    <animate attributeName="x2" from="60" to="-20" dur="0.4s" repeatCount="indefinite"/>
  </line>
  <line x1="120" y1="280" x2="70" y2="280" stroke="white" stroke-width="1.5" opacity="0.4">
    <animate attributeName="x1" from="120" to="30" dur="0.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" from="70" to="-10" dur="0.5s" repeatCount="indefinite"/>
  </line>
  <line x1="90" y1="245" x2="50" y2="245" stroke="white" stroke-width="1" opacity="0.3">
    <animate attributeName="x1" from="90" to="10" dur="0.35s" repeatCount="indefinite"/>
    <animate attributeName="x2" from="50" to="-30" dur="0.35s" repeatCount="indefinite"/>
  </line>

</svg>

</body>
</html>
