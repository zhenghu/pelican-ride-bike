<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Anthropic-ClaudeHaiku-5.5 · 鹈鹕骑自行车</title>
<style>
  html, body { margin: 0; height: 100%; background: #1f2533; overflow: hidden; }
  svg { display: block; width: 100%; height: 100%; cursor: pointer; }

  /* 太阳光线缓慢旋转 */
  .rays { transform-box: view-box; transform-origin: 820px 130px; animation: spin 40s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 眨眼 */
  .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }

  /* 速度线 */
  .speed line { stroke: #ffffff; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 46 200; opacity: 0.75; animation: streak 0.9s linear infinite; }
  .speed line:nth-child(2) { animation-delay: -0.35s; }
  .speed line:nth-child(3) { animation-delay: -0.6s; }
  @keyframes streak { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 246; } }

  /* 点击暂停时冻结所有 CSS 动画 */
  .paused * { animation-play-state: paused !important; }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a6ef"/>
      <stop offset="0.6" stop-color="#ffc7c0"/>
      <stop offset="1" stop-color="#ffe3c2"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff6cf" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff6cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6070"/>
      <stop offset="1" stop-color="#3a3f4c"/>
    </linearGradient>
    <linearGradient id="plumage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7e4ee"/>
    </linearGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="56" ry="19" fill="#fff9fc"/>
      <ellipse cx="-24" cy="-13" rx="28" ry="20" fill="#fff9fc"/>
      <ellipse cx="22" cy="-17" rx="32" ry="25" fill="#fff9fc"/>
    </g>
    <g id="tree">
      <rect x="-4" y="-34" width="8" height="34" rx="3" fill="#8b6b57"/>
      <circle cx="0" cy="-52" r="25" fill="#6eb37a"/>
      <circle cx="-12" cy="-43" r="15" fill="#86c788"/>
    </g>
  </defs>

  <!-- 天空与太阳 -->
  <rect width="1000" height="650" fill="url(#sky)"/>
  <circle cx="820" cy="130" r="120" fill="url(#sunGlow)"/>
  <g class="rays">
    <path d="M886 130L908 130M877 163L896 174M853 187L864 206M820 196L820 218M787 187L776 206M763 163L744 174M754 130L732 130M763 97L744 86M787 73L776 54M820 64L820 42M853 73L864 54M877 97L896 86" stroke="#fff3c4" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
  <circle cx="820" cy="130" r="46" fill="#ffe9a0"/>
  <circle cx="820" cy="130" r="36" fill="#fff3c4"/>

  <!-- 云（横向循环滚动） -->
  <g id="clouds">
    <use href="#cloud" x="120" y="120"/>
    <use href="#cloud" x="470" y="90"/>
    <use href="#cloud" x="760" y="165"/>
    <use href="#cloud" x="1120" y="120"/>
    <use href="#cloud" x="1470" y="90"/>
    <use href="#cloud" x="1760" y="165"/>
  </g>

  <!-- 远山、近山（循环滚动，视差不同） -->
  <g id="farHills">
    <path d="M0 420Q125 340 250 415Q375 490 500 415Q625 340 750 415Q875 490 1000 420L1000 520L0 520Z" fill="#d7a9dc"/>
    <path transform="translate(1000 0)" d="M0 420Q125 340 250 415Q375 490 500 415Q625 340 750 415Q875 490 1000 420L1000 520L0 520Z" fill="#d7a9dc"/>
  </g>
  <g id="midHills">
    <path d="M0 448Q200 380 400 448Q600 508 800 448Q900 418 1000 448L1000 530L0 530Z" fill="#8fd09b"/>
    <path transform="translate(1000 0)" d="M0 448Q200 380 400 448Q600 508 800 448Q900 418 1000 448L1000 530L0 530Z" fill="#8fd09b"/>
  </g>

  <!-- 草地与树（循环滚动） -->
  <rect y="470" width="1000" height="60" fill="#7cc27a"/>
  <g id="trees">
    <use href="#tree" x="0" y="470"/>
    <use href="#tree" x="175" y="470"/>
    <use href="#tree" x="350" y="470"/>
    <use href="#tree" x="525" y="470"/>
    <use href="#tree" x="700" y="470"/>
    <use href="#tree" x="875" y="470"/>
    <use href="#tree" x="1050" y="470"/>
    <use href="#tree" x="1225" y="470"/>
  </g>

  <!-- 路面 -->
  <rect y="520" width="1000" height="130" fill="url(#road)"/>
  <rect y="515" width="1000" height="6" fill="#efe3c6"/>
  <line id="roadDash" x1="0" y1="588" x2="1000" y2="588" stroke="#ffd86b" stroke-width="6" stroke-dasharray="40 40"/>
  <ellipse cx="448" cy="521" rx="190" ry="8" fill="#000" opacity="0.2"/>

  <!-- 速度线 -->
  <g class="speed">
    <line x1="90" y1="300" x2="220" y2="300"/>
    <line x1="70" y1="352" x2="200" y2="352"/>
    <line x1="110" y1="404" x2="230" y2="404"/>
  </g>

  <!-- 整车（自行车 + 鹈鹕），随路面轻微颠簸 -->
  <g transform="translate(28 0)">
    <g id="vehicle">
      <!-- 车轮 -->
      <g transform="translate(330 460)">
        <g id="rwSpin">
          <circle r="57" fill="none" stroke="#2a2d36" stroke-width="7"/>
          <circle r="51" fill="none" stroke="#c9d1dc" stroke-width="2"/>
          <path d="M0 0L52 0M0 0L45 26M0 0L26 45M0 0L0 52M0 0L-26 45M0 0L-45 26M0 0L-52 0M0 0L-45-26M0 0L-26-45M0 0L0-52M0 0L26-45M0 0L45-26" stroke="#c9d1dc" stroke-width="1.2" fill="none"/>
          <circle cx="50" cy="0" r="3.2" fill="#ffd86b"/>
          <circle r="5" fill="#5b6270"/>
        </g>
      </g>
      <g transform="translate(550 460)">
        <g id="fwSpin">
          <circle r="57" fill="none" stroke="#2a2d36" stroke-width="7"/>
          <circle r="51" fill="none" stroke="#c9d1dc" stroke-width="2"/>
          <path d="M0 0L52 0M0 0L45 26M0 0L26 45M0 0L0 52M0 0L-26 45M0 0L-45 26M0 0L-52 0M0 0L-45-26M0 0L-26-45M0 0L0-52M0 0L26-45M0 0L45-26" stroke="#c9d1dc" stroke-width="1.2" fill="none"/>
          <circle cx="50" cy="0" r="3.2" fill="#ffd86b"/>
          <circle r="5" fill="#5b6270"/>
        </g>
      </g>

      <!-- 远侧腿与曲柄（位于车架后方） -->
      <line id="farCrank" x1="408" y1="468" x2="408" y2="494" stroke="#6b7180" stroke-width="6" stroke-linecap="round"/>
      <path id="farLeg" fill="none" stroke="#c4581a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="farFoot" fill="#c4581a"/>
      <rect id="farPedal" width="20" height="4" rx="2" fill="#2b2d33"/>

      <!-- 车架 -->
      <g fill="none" stroke="#14a388" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M330 460L408 468"/>
        <path d="M330 460L378 396"/>
        <path d="M378 396L408 468"/>
        <path d="M378 396L512 366"/>
        <path d="M408 468L522 390"/>
        <path d="M512 366L522 390"/>
        <path d="M522 390L550 460"/>
      </g>

      <!-- 链条与牙盘 -->
      <path d="M408 453L330 451M408 483L330 469" stroke="#3a3e4a" stroke-width="2.5" stroke-linecap="round"/>
      <g id="chainring">
        <circle cx="408" cy="468" r="15" fill="none" stroke="#7b8291" stroke-width="3"/>
        <path d="M408 458V478M398 468H418" stroke="#7b8291" stroke-width="2"/>
      </g>

      <!-- 座杆与车座 -->
      <line x1="378" y1="396" x2="372" y2="382" stroke="#aeb6c3" stroke-width="6" stroke-linecap="round"/>
      <path d="M342 384Q370 366 404 372Q410 378 398 384Q372 388 346 390Q338 388 342 384Z" fill="#2b2d33"/>

      <!-- 鹈鹕（骑手），随踩踏轻微起伏 -->
      <g id="pelican">
        <!-- 尾羽 -->
        <path d="M334 304Q300 290 268 300Q294 314 300 324Q280 326 262 338Q300 346 334 334Z" fill="#dfe3ea" stroke="#b7bfcc" stroke-width="2" stroke-linejoin="round"/>
        <!-- 颈 -->
        <path d="M436 300C468 286 482 250 508 222" fill="none" stroke="#c4cad4" stroke-width="36" stroke-linecap="round"/>
        <path d="M436 300C468 286 482 250 508 222" fill="none" stroke="#fbfcfd" stroke-width="31" stroke-linecap="round"/>
        <!-- 身体 -->
        <ellipse cx="380" cy="314" rx="80" ry="50" transform="rotate(-14 380 314)" fill="url(#plumage)" stroke="#c4cad4" stroke-width="2.5"/>
        <!-- 围巾（以颈根为轴飘动） -->
        <g id="scarfG">
          <path d="M468 256C444 246 430 262 402 254L404 270C430 280 448 272 470 282Z" fill="#e63946"/>
          <path d="M468 264C446 268 430 290 410 296L412 306C436 300 452 292 470 276Z" fill="#c42b38"/>
        </g>
        <!-- 翅膀（以肩部为轴扇动，翼尖抓住车把） -->
        <g id="wingG">
          <path d="M396 290C436 262 500 272 552 318C566 328 572 336 566 342C530 344 480 336 440 330C420 326 404 318 396 290Z" fill="#fffdf8" stroke="#c4cad4" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M552 318C566 328 572 336 566 342C556 343 546 336 538 326Z" fill="#2d2f38"/>
          <path d="M420 300C460 300 500 312 530 330" fill="none" stroke="#c9ced8" stroke-width="2.5" stroke-linecap="round"/>
        </g>
        <!-- 头与喙（以颈根为轴点动） -->
        <g id="headG">
          <circle cx="522" cy="208" r="26" fill="#fbfcfd" stroke="#c4cad4" stroke-width="2.5"/>
          <path d="M506 186Q498 170 510 166Q506 178 518 182" fill="none" stroke="#f2c76b" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="532" cy="200" r="7" fill="#fff1b8" stroke="#8d7a55" stroke-width="1.5"/>
          <g class="blink"><circle cx="533" cy="200" r="3.6" fill="#1f1f24"/><circle cx="534.5" cy="198.5" r="1.1" fill="#fff"/></g>
          <path d="M542 198Q612 198 670 212Q678 220 670 226Q612 228 542 224Z" fill="#ffa14a" stroke="#d9731f" stroke-width="2" stroke-linejoin="round"/>
          <path d="M542 224Q604 230 650 228Q616 266 574 252Q552 242 542 224Z" fill="#ffc15e" stroke="#d9731f" stroke-width="2" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- 车把 -->
      <path d="M512 366L516 340" stroke="#2b2d33" stroke-width="7" stroke-linecap="round"/>
      <path d="M516 340Q542 330 572 336" fill="none" stroke="#2b2d33" stroke-width="6" stroke-linecap="round"/>

      <!-- 近侧腿与曲柄（最前方） -->
      <line id="nearCrank" x1="408" y1="468" x2="408" y2="494" stroke="#7b8291" stroke-width="6" stroke-linecap="round"/>
      <path id="nearLeg" fill="none" stroke="#ff8a3d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="nearFoot" fill="#ff8a3d" stroke="#d9631e" stroke-width="1.5" stroke-linejoin="round"/>
      <rect id="nearPedal" width="20" height="4" rx="2" fill="#2b2d33"/>
      <circle cx="408" cy="468" r="4" fill="#c9ced8"/>
    </g>
  </g>

  <text x="32" y="50" font-family="PingFang SC, system-ui, sans-serif" font-size="22" font-weight="700" fill="#2b1f4a" opacity="0.8">鹈鹕骑自行车 · Claude Haiku 5.5</text>
</svg>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const f = (v) => v.toFixed(1);
  const deg = (rad) => (rad * 180) / Math.PI;

  const svg = $('scene');
  const BB = { x: 408, y: 468 };    // 中轴位置
  const CRANK = 26;                 // 曲柄长度
  const THIGH = 74, SHIN = 76;      // 大腿、小腿长度
  const HIP = { x: 376, y: 364 };   // 髋部（鞍座上方）
  const WHEEL_R = 60;               // 车轮半径
  const SPEED = 190;                // 前进速度（px/s）

  const farHills = $('farHills'), midHills = $('midHills'), trees = $('trees'), clouds = $('clouds');
  const roadDash = $('roadDash'), vehicle = $('vehicle'), pelican = $('pelican');
  const rwSpin = $('rwSpin'), fwSpin = $('fwSpin'), chainring = $('chainring');
  const wingG = $('wingG'), headG = $('headG'), scarfG = $('scarfG');

  let dist = 0, time = 0, last = null, paused = false;

  svg.addEventListener('click', () => {
    paused = !paused;
    svg.classList.toggle('paused', paused);
    last = null;
  });

  // 两段骨骼反解：返回膝关节与（必要时收束后的）踝点，膝关节取位于前方的解
  function solveLeg(hip, ankle) {
    let dx = ankle.x - hip.x, dy = ankle.y - hip.y;
    let d = Math.hypot(dx, dy);
    const maxD = THIGH + SHIN - 0.5;
    if (d > maxD) {
      const s = maxD / d;
      dx *= s;
      dy *= s;
      d = maxD;
    }
    const base = Math.atan2(dy, dx);
    const cos = (THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d);
    const off = Math.acos(Math.max(-1, Math.min(1, cos)));
    const k1 = { x: hip.x + THIGH * Math.cos(base + off), y: hip.y + THIGH * Math.sin(base + off) };
    const k2 = { x: hip.x + THIGH * Math.cos(base - off), y: hip.y + THIGH * Math.sin(base - off) };
    return { knee: k1.x > k2.x ? k1 : k2, foot: { x: hip.x + dx, y: hip.y + dy } };
  }

  function drawLeg(prefix, angle, hip) {
    const pedal = { x: BB.x + Math.cos(angle) * CRANK, y: BB.y + Math.sin(angle) * CRANK };
    const { knee, foot } = solveLeg(hip, { x: pedal.x - 2, y: pedal.y - 8 });

    const crank = $(prefix + 'Crank');
    crank.setAttribute('x2', f(pedal.x));
    crank.setAttribute('y2', f(pedal.y));

    $(prefix + 'Leg').setAttribute('d',
      `M${f(hip.x)} ${f(hip.y)}L${f(knee.x)} ${f(knee.y)}L${f(foot.x)} ${f(foot.y)}`);

    const ax = foot.x, ay = foot.y;
    $(prefix + 'Foot').setAttribute('d',
      `M${f(ax - 4)} ${f(ay - 2)}L${f(ax + 16)} ${f(ay + 6)}Q${f(ax + 20)} ${f(ay + 11)} ${f(ax + 12)} ${f(ay + 11)}L${f(ax + 4)} ${f(ay + 9)}L${f(ax - 6)} ${f(ay + 6)}Z`);

    const pedalEl = $(prefix + 'Pedal');
    pedalEl.setAttribute('x', f(pedal.x - 10));
    pedalEl.setAttribute('y', f(pedal.y + 1));
  }

  function frame(now) {
    if (last === null) last = now;
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (!paused) {
      dist += SPEED * dt;
      time += dt;
    }

    const phi = dist / WHEEL_R;                      // 车轮转角（弧度）
    const theta = phi;                               // 曲柄与车轮同步转动
    const bob = Math.sin(theta * 2) * 1.5;           // 骑手随踩踏起伏
    const jolt = Math.abs(Math.sin(phi * 2)) * 1.2;  // 路面颠簸

    vehicle.setAttribute('transform', `translate(0 ${f(-jolt)})`);
    pelican.setAttribute('transform', `translate(0 ${f(bob)})`);
    rwSpin.setAttribute('transform', `rotate(${f(deg(phi))})`);
    fwSpin.setAttribute('transform', `rotate(${f(deg(phi))})`);
    chainring.setAttribute('transform', `rotate(${f(deg(theta))} ${BB.x} ${BB.y})`);

    wingG.setAttribute('transform', `rotate(${f(Math.sin(time * 4.5) * 4)} 396 290)`);
    headG.setAttribute('transform', `rotate(${f(Math.sin(time * 3.9) * 1.5)} 500 240)`);
    scarfG.setAttribute('transform', `rotate(${f(Math.sin(time * 7) * 5)} 470 262)`);

    const hip = { x: HIP.x, y: HIP.y + bob };
    drawLeg('far', theta + Math.PI, hip);
    drawLeg('near', theta, hip);

    farHills.setAttribute('transform', `translate(${f((-dist * 0.12) % 1000)} 0)`);
    midHills.setAttribute('transform', `translate(${f((-dist * 0.25) % 1000)} 0)`);
    trees.setAttribute('transform', `translate(${f((-dist * 0.55) % 175)} 0)`);
    clouds.setAttribute('transform', `translate(${f((-dist * 0.05) % 1000)} 0)`);
    roadDash.setAttribute('stroke-dashoffset', f(dist % 80));

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
