<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>OpenAI-GPTAstra-6.2 · 鹈鹕骑行记</title>
  <style>
    :root { color-scheme: light; --ink: #263f40; --muted: #63716b; --paper: #f6f2e8; --rust: #af4935; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: min(100% - 48px, 980px); padding-block: clamp(24px, 5vh, 64px); }
    header, figcaption { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    header { align-items: flex-end; margin-bottom: 20px; }
    .eyebrow, .plate { font: 600 10px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .16em; }
    .eyebrow { display: flex; align-items: center; gap: 10px; color: var(--rust); }
    .eyebrow::before { content: ""; width: 25px; height: 3px; background: currentColor; }
    h1 { margin: 7px 0 0; font: 700 clamp(32px, 5vw, 55px)/1.18 "Songti SC", "Noto Serif CJK SC", SimSun, serif; letter-spacing: .04em; }
    .plate { text-align: right; color: var(--muted); border-right: 3px solid #d37a59; padding-right: 10px; }
    figure { margin: 0; }
    .mat { padding: 7px; border: 1px solid #bbb8a6; border-radius: 6px; background: #fffbef; box-shadow: 0 10px 25px -20px #34483c; }
    .scene { aspect-ratio: 900 / 456; overflow: hidden; border-radius: 2px; background: #f7e6c5; }
    #ride { display: block; width: 100%; height: 100%; }
    figcaption { padding: 13px 1px 0; }
    .caption { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #495e58; }
    .caption svg { color: #447e79; flex: none; }
    button { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px; border: 1px solid #84948a; border-radius: 100px; color: var(--ink); background: transparent; font: inherit; font-size: 13px; font-weight: 600; line-height: 1.3; cursor: pointer; }
    button:hover { background: #e7ebdf; }
    button:focus-visible { outline: 3px solid var(--rust); outline-offset: 3px; }
    button[hidden], .play-icon, [data-paused="true"] .pause-icon { display: none; }
    [data-paused="true"] .play-icon { display: inline; }
    @media (max-width: 600px) {
      main { width: calc(100% - 24px); }
      header { margin-bottom: 14px; }
      .mat { padding: 4px; }
      .scene { aspect-ratio: 1.24; }
      .caption { font-size: 12px; gap: 6px; }
    }
  </style>
</head>

  <script>
    const ride = document.getElementById('ride');
    const playback = document.getElementById('playback');
    const label = document.getElementById('playback-label');
    const motion = window.matchMedia('(prefers-reduced-motion: reduce)');

    function setPaused(paused) {
      if (paused) ride.pauseAnimations(); else ride.unpauseAnimations();
      playback.dataset.paused = String(paused);
      label.textContent = paused ? '播放动画' : '暂停动画';
    }

    setPaused(motion.matches);
    playback.hidden = false;
    playback.addEventListener('click', () => setPaused(!ride.animationsPaused()));
    motion.addEventListener('change', event => setPaused(event.matches));
  </script>
</body>
</html>
