<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="一只戴酒红贝雷帽与芥末黄圆点围巾的鹈鹕，骑着奶油白与朱红相间的复古自行车，穿过铺满落叶的秋日林荫道。">
<title>Tencent-Hunyuan-4 · 鹈鹕骑自行车</title>
<style>
  :root {
    --ink: #2b2a28;
    --cream: #fdf6e6;
    --vermilion: #c8443a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1c2b31;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif;
    user-select: none;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 70% 24%, #4a6063 0%, #1c2b31 82%);
  }
  svg#scene { width: 100%; height: 100%; display: block; }
  .controls {
    position: absolute;
    right: 22px;
    bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(26, 36, 40, 0.72);
    border: 1px solid rgba(253, 246, 230, 0.18);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 5;
  }
  .btn {
    appearance: none;
    border: 1px solid rgba(253, 246, 230, 0.24);
    background: rgba(253, 246, 230, 0.08);
    color: #fbf5e6;
    font: 600 12px/1 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
  }
  .btn:hover { background: rgba(253, 246, 230, 0.18); border-color: rgba(253, 246, 230, 0.45); }
  .btn:active { transform: scale(0.96); }
  .btn[aria-pressed="true"] { background: rgba(200, 68, 58, 0.9); border-color: #ffd6c4; color: #fffaf2; }
  .speed-tag { font-size: 11px; letter-spacing: 0.06em; color: rgba(253, 246, 230, 0.82); padding: 0 6px; }
  @media (max-width: 620px) {
    .speed-tag { display: none; }
    .controls { right: 12px; bottom: 12px; padding: 5px 7px; }
  }
</style>
</head>

          <path d="M552 100

          <g id="pelican-eye">

          <path d="M531 90 Q541 85 551 91" fill="none" stroke="#9e8e74" stroke-width="2" stroke-linecap="round"/>

          <g transform="translate(528 74) rotate(-14)">
            <path d="M-30 6 Q-4 -14 26 -2 Q34 2 28 10 Q0 16 -30 10 Z" fill="#8c3b46" stroke="#5f2530" stroke-width="1.6"/>

        <g id="near-crank-group">

          <path id="near-hip-fluff" fill="#fbf5e6" stroke="#c4b59b" stroke-width="1.6"/>

            <path d="M-10 -4 L18 -5 L38 2 L28 10 L-5 7 Q-12 4 -10 -4 Z" fill="#f59642" stroke="#9e4f1e" stroke-width="1.8" stroke-linejoin="round"/>

        <path d="M640 258 Q620 262 600 272" fill="none" stroke="url(#chrome)" stroke-width="6" stroke-linecap="round"/>
        <path d="M612 266 L594 275" fill="none" stroke="#6e3c24" stroke-width="9.5" stroke-linecap="round"/>
        <g transform="translate(624 250)">
          <path d="M-7 4 A7 7 0 0 1 7 4 Z" fill="#ebb046" stroke="#7d5315" stroke-width="1.5"/>

          <g id="wing-hand" transform="translate(600 272)">
            <path d="M-8 -6 Q4 -12 14 -4 Q16 4 6 8 Q-4 9 -10 2 Z" fill="#fbf4e4" stroke="#b5a589" stroke-width="1.8"/>
            <path d="M-2 -3 L8 -2 M-3 2 L6 3" stroke="#cbbba0" stroke-width="1.5" stroke-linecap="round"/>

      <g opacity="0.9">

        <use id="leaf-3" href="#maple-leaf"/>
        <use id="leaf-4" href="#maple-leaf"/>
        <use id="leaf-5" href="#maple-leaf"/>
        <use id="leaf-6" href="#maple-leaf"/>

      <g transform="translate(42 52)" pointer-events="none">
        <text x="0" y="0" fill="#5b4632" font-size="11" font-weight="600" letter-spacing="3.2" opacity="0.8">AUTUMN AVENUE · GOLDEN MILE</text>
        <text x="0" y="34" fill="#3f3226" font-size="26" font-weight="700" letter-spacing="1.5">秋日林荫 · 鹈鹕单车行</text>
        <line x1="0" y1="46" x2="72" y2="46" stroke="#c8443a" stroke-width="3.5" stroke-linecap="round"/>
      </g>

  <div class="controls" aria-label="动画控制">
    <span class="speed-tag" id="status-text">林间巡航</span>
    <button type="button" class="btn" id="ring-btn" title="按响车铃">🔔 摇铃</button>
    <button type="button" class="btn" id="sprint-btn" aria-pressed="false">⚡ 加速</button>
    <button type="button" class="btn" id="pause-btn" aria-pressed="false">暂停</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;

  const BB = { x: 490, y: 461 };
  const CRANK_R = 38;
  const WHEEL_R = 84;
  const GEAR_RATIO = 1.9;
  const THIGH = 100;
  const SHIN = 100;
  const MAX_REACH = THIGH + SHIN - 2;
  const GRIP = { x: 600, y: 272 };

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  let paused = reduced.matches;
  let sprint = false;
  let speed = 1;
  let phase = 0.4;
  let worldTime = 0;
  let bellTimer = 0;
  let lastTs = null;
  let rafId = 0;

  function solveKnee(hip, ankle) {
    const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
    const dist = Math.min(Math.max(Math.hypot(dx, dy), 26), MAX_REACH);
    const base = Math.atan2(dy, dx);
    const cos = Math.min(1, Math.max(-1,
      (THIGH * THIGH + dist * dist - SHIN * SHIN) / (2 * THIGH * dist)));
    const a = base - Math.acos(cos);
    return { x: hip.x + Math.cos(a) * THIGH, y: hip.y + Math.sin(a) * THIGH };
  }

  function updateLeg(side, angle, hip) {
    const pin = { x: BB.x + Math.cos(angle) * CRANK_R, y: BB.y + Math.sin(angle) * CRANK_R };
    const ankle = { x: pin.x - 3, y: pin.y - 8 };
    const knee = solveKnee(hip, ankle);

    const crank = $(`${side}-crank`);
    crank.setAttribute('x1', BB.x);
    crank.setAttribute('y1', BB.y);
    crank.setAttribute('x2', pin.x.toFixed(2));
    crank.setAttribute('y2', pin.y.toFixed(2));
    $(`${side}-pedal`).setAttribute('transform', `translate(${pin.x.toFixed(2)} ${pin.y.toFixed(2)})`);

    const thigh = `M${hip.x.toFixed(2)} ${hip.y.toFixed(2)} L${knee.x.toFixed(2)} ${knee.y.toFixed(2)}`;
    const shin = `M${knee.x.toFixed(2)} ${knee.y.toFixed(2)} L${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)}`;
    $(`${side}-thigh`).setAttribute('d', thigh);
    $(`${side}-shin`).setAttribute('d', shin);
    $(`${side}-knee-joint`).setAttribute('cx', knee.x.toFixed(2));
    $(`${side}-knee-joint`).setAttribute('cy', knee.y.toFixed(2));

    if (side === 'near') {
      $('near-thigh-border').setAttribute('d', thigh);
      $('near-shin-border').setAttribute('d', shin);
      const mx = hip.x + (knee.x - hip.x) * 0.5;
      const my = hip.y + (knee.y - hip.y) * 0.5;
      $('near-hip-fluff').setAttribute('d',
        `M${(hip.x - 16).toFixed(1)} ${(hip.y - 6).toFixed(1)} Q${(hip.x + 14).toFixed(1)} ${(hip.y - 14).toFixed(1)} ${mx.toFixed(1)} ${(my - 6).toFixed(1)} Q${(hip.x + 2).toFixed(1)} ${(hip.y + 16).toFixed(1)} ${(hip.x - 16).toFixed(1)} ${(hip.y - 6).toFixed(1)} Z`);
    }

    const tilt = Math.sin(angle) * 8;
    $(`${side}-foot`).setAttribute('transform',
      `translate(${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)}) rotate(${tilt.toFixed(2)})`);
  }

  function scarfWave(x0, y0, len, amp, shift) {
    let d = `M${x0} ${y0}`;
    for (let i = 1; i <= 12; i++) {
      const t = i / 12;
      const x = x0 - t * len;
      const w = Math.sin(worldTime * (6 * speed) - t * 5 + shift) * amp * Math.pow(t, 0.85);
      const drop = t * 14;
      d += ` L${x.toFixed(2)} ${(y0 + drop + w).toFixed(2)}`;
    }
    return d;
  }

  function render() {
    const wheelRad = phase * GEAR_RATIO;
    const wheelDeg = (wheelRad * 180 / Math.PI) % 360;
    const crankDeg = (phase * 180 / Math.PI) % 360;
    const travel = wheelRad * WHEEL_R;

    $('rear-wheel-rotor').setAttribute('transform', `rotate(${wheelDeg.toFixed(2)})`);
    $('front-wheel-rotor').setAttribute('transform', `rotate(${wheelDeg.toFixed(2)})`);
    $('chainring').setAttribute('transform', `translate(${BB.x} ${BB.y}) rotate(${crankDeg.toFixed(2)})`);
    $('drive-chain').setAttribute('stroke-dashoffset', (-phase * 32).toFixed(2));

    const bob = Math.sin(phase * 2 - 0.4) * 3.2;
    const pitch = Math.sin(phase * 2) * 0.9 - (speed - 1) * 2.2;
    $('pelican-body').setAttribute('transform', `translate(0 ${bob.toFixed(2)}) rotate(${pitch.toFixed(2)} 440 260)`);
    $('bike-shadow').setAttribute('rx', (250 - bob * 1.6).toFixed(1));

    const sway = Math.sin(phase * 2 - 1.1) * 2.6;
    $('gular-pouch').setAttribute('transform', `translate(0 ${(sway * 0.45).toFixed(2)}) rotate(${(sway * 0.55).toFixed(2)} 560 116)`);
    $('head-crest').setAttribute('transform', `rotate(${(Math.sin(worldTime * 9 * speed) * 3).toFixed(2)} 520 78)`);
    $('tail-feathers').setAttribute('transform', `rotate(${(Math.sin(phase * 2 + 0.8) * 2.8).toFixed(2)} 366 280)`);
    const blink = worldTime % 4.8;
    const sy = (blink > 4.48 && blink < 4.66) ? 0.12 : 1;
    $('pelican-eye').setAttribute('transform', `translate(0 ${(100 * (1 - sy)).toFixed(2)}) scale(1 ${sy})`);

    updateLeg('near', phase, { x: 428, y: 318 + bob });
    updateLeg('far', phase + Math.PI, { x: 440, y: 314 + bob });

    const shoulder = { x: 466, y: 224 + bob };
    const elbow = { x: 524 + Math.sin(phase * 2) * 1.5, y: 262 + bob * 0.55 };
    const wing = `M${shoulder.x.toFixed(1)} ${shoulder.y.toFixed(1)} Q${elbow.x.toFixed(1)} ${elbow.y.toFixed(1)} ${GRIP.x} ${GRIP.y}`;
    $('wing-arm-shadow').setAttribute('d', wing);
    $('wing-arm-main').setAttribute('d', wing);
    $('wing-shoulder').setAttribute('d',
      `M${(shoulder.x - 24).toFixed(1)} ${(shoulder.y + 4).toFixed(1)} Q${(shoulder.x + 8).toFixed(1)} ${(shoulder.y - 18).toFixed(1)} ${(elbow.x - 6).toFixed(1)} ${(elbow.y - 10).toFixed(1)} Q${(shoulder.x + 4).toFixed(1)} ${(shoulder.y + 24).toFixed(1)} ${(shoulder.x - 24).toFixed(1)} ${(shoulder.y + 4).toFixed(1)} Z`);
    $('far-wing-arm').setAttribute('d', `M470 ${(220 + bob).toFixed(1)} Q532 ${(236 + bob * 0.5).toFixed(1)} 600 268`);

    const scarfY = 168 + bob;
    const scarfLen = 108 + (speed - 1) * 24;
    const main = scarfWave(480, scarfY, scarfLen, 12, 0);
    $('scarf-back').setAttribute('d', scarfWave(478, scarfY + 5, scarfLen * 0.84, 10, 1.1));
    $('scarf-front').setAttribute('d', main);
    $('scarf-stripes').setAttribute('d', main);

    const baguetteBob = Math.sin(worldTime * 4) * 2.4;
    $('basket-baguette').setAttribute('transform', `translate(0 ${baguetteBob.toFixed(2)}) rotate(${(baguetteBob * 0.8).toFixed(2)})`);

    if (bellTimer > 0) {
      $('bell-rings').setAttribute('opacity', (Math.min(1, bellTimer * 2.2) * (0.5 + 0.5 * Math.sin(worldTime * 38))).toFixed(2));
    } else {
      $('bell-rings').setAttribute('opacity', '0');
    }

    const oRoad = travel % 260;
    const oMid = (travel * 0.5) % 320;
    const oFar = (travel * 0.24) % 380;
    const oHill = (travel * 0.08) % 600;
    $('road-track').setAttribute('transform', `translate(${(-oRoad).toFixed(2)} 0)`);
    $('mid-tree-track').setAttribute('transform', `translate(${(-oMid).toFixed(2)} 0)`);
    $('far-tree-track').setAttribute('transform', `translate(${(-oFar).toFixed(2)} 0)`);
    $('hill-track').setAttribute('transform', `translate(${(-oHill).toFixed(2)} 0)`);
    $('cloud-layer').setAttribute('transform', `translate(${(-(worldTime * 8 % 1080)).toFixed(2)} 0)`);

    for (let i = 0; i < 8; i++) {
      const vy = 26 + (i % 4) * 9;
      const y = ((worldTime * vy * speed + i * 83) % 720) - 40;
      const x = 40 + ((i * 127 + worldTime * (18 + i * 3) * speed) % 940) + Math.sin(worldTime * 1.3 + i) * 22;
      const rot = worldTime * (50 + i * 11) + i * 47;
      const s = 0.7 + (i % 3) * 0.18;
      $(`leaf-${i}`).setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${s})`);
    }

    const w1 = (worldTime * 360 * speed) % 900;
    const w2 = (worldTime * 420 * speed + 310) % 950;
    const w3 = (worldTime * 480 * speed + 620) % 920;
    $('wind-1').setAttribute('transform', `translate(${(650 - w1).toFixed(1)} 0)`);
    $('wind-2').setAttribute('transform', `translate(${(720 - w2).toFixed(1)} 0)`);
    $('wind-3').setAttribute('transform', `translate(${(680 - w3).toFixed(1)} 0)`);
    $('wind-lines').setAttribute('opacity', sprint ? '0.55' : '0.24');
  }

  function tick(now) {
    if (lastTs !== null) {
      const dt = Math.min((now - lastTs) / 1000, 0.05);
      const target = sprint ? 1.68 : 1;
      speed += (target - speed) * Math.min(1, dt * 6);
      worldTime += dt;
      phase = (phase + dt * 3.75 * speed) % (TAU * 1000);
      if (bellTimer > 0) bellTimer = Math.max(0, bellTimer - dt);
    }
    lastTs = now;
    render();
    if (!paused && !document.hidden) {
      rafId = requestAnimationFrame(tick);
    } else {
      rafId = 0;
    }
  }

  function startLoop() {
    if (!rafId && !paused && !document.hidden) {
      lastTs = null;
      rafId = requestAnimationFrame(tick);
    }
  }

  function stopLoop() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    lastTs = null;
  }

  function syncUI() {
    $('pause-btn').textContent = paused ? '播放' : '暂停';
    $('pause-btn').setAttribute('aria-pressed', String(paused));
    $('sprint-btn').setAttribute('aria-pressed', String(sprint));
    $('status-text').textContent = paused ? '驻足看叶' : (sprint ? '乘风冲刺' : '林间巡航');
  }

  $('pause-btn').addEventListener('click', () => {
    paused = !paused;
    if (paused) stopLoop(); else startLoop();
    syncUI();
  });
  $('sprint-btn').addEventListener('click', () => {
    sprint = !sprint;
    if (paused) { paused = false; startLoop(); }
    syncUI();
  });
  $('ring-btn').addEventListener('click', () => {
    bellTimer = 0.9;
    if (paused) render();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopLoop(); else startLoop();
  });
  reduced.addEventListener('change', e => {
    if (e.matches) { paused = true; stopLoop(); syncUI(); }
  });

  render();
  syncUI();
  startLoop();
})();
</script>
