<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huawei-OpenPangu-2.1 · Pelican Riding a Bicycle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #8ec5e8 0%, #bfe4f5 55%, #e8f7fb 100%);
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }
  .scene {
    width: min(92vw, 960px);
  }
  svg { width: 100%; height: auto; display: block; }

  /* Ground scrolling */
  .ground { animation: scrollGround 1.2s linear infinite; }
  @keyframes scrollGround {
    from { transform: translateX(0); }
    to   { transform: translateX(-80px); }
  }

  /* Hills / clouds parallax */
  .hills   { animation: scrollHills 3s linear infinite; }
  @keyframes scrollHills {
    from { transform: translateX(0); }
    to   { transform: translateX(-160px); }
  }
  .clouds  { animation: drift 18s linear infinite; }
  @keyframes drift {
    from { transform: translateX(-120px); }
    to   { transform: translateX(120px); }
  }

  /* Whole bike bob */
  .bike-bob { animation: bob 0.5s ease-in-out infinite; transform-origin: 300px 360px; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50%      { transform: translateY(-6px) rotate(1deg); }
  }

  /* Wheel spin */
  .wheel-spin { transform-origin: 150px 360px; animation: spin 0.6s linear infinite; }
  .wheel-spin-b { transform-origin: 450px 360px; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Pedal crank rotation */
  .crank { transform-origin: 300px 360px; animation: spin 0.6s linear infinite; }

  /* Legs pedaling: each leg pivots at the hip, follows the pedal */
  .leg-thigh-l { transform-origin: 270px 300px; animation: pedalL-thigh 0.6s linear infinite; }
  .leg-shin-l  { transform-origin: 270px 330px; animation: pedalL-shin 0.6s linear infinite; }
  .leg-thigh-r { transform-origin: 270px 300px; animation: pedalR-thigh 0.6s linear infinite; }
  .leg-shin-r  { transform-origin: 270px 330px; animation: pedalR-shin 0.6s linear infinite; }

  @keyframes pedalL-thigh {
    0%   { transform: rotate(28deg); }
    25%  { transform: rotate(-24deg); }
    50%  { transform: rotate(-30deg); }
    75%  { transform: rotate(24deg); }
    100% { transform: rotate(28deg); }
  }
  @keyframes pedalL-shin {
    0%   { transform: rotate(-6deg); }
    50%  { transform: rotate(38deg); }
    100% { transform: rotate(-6deg); }
  }
  @keyframes pedalR-thigh {
    0%   { transform: rotate(-30deg); }
    25%  { transform: rotate(24deg); }
    50%  { transform: rotate(28deg); }
    75%  { transform: rotate(-24deg); }
    100% { transform: rotate(-30deg); }
  }
  @keyframes pedalR-shin {
    0%   { transform: rotate(38deg); }
    50%  { transform: rotate(-6deg); }
    100% { transform: rotate(38deg); }
  }

  /* Wing flap */
  .wing { transform-origin: 250px 250px; animation: flap 0.5s ease-in-out infinite; }
  @keyframes flap {
    0%, 100% { transform: rotate(6deg); }
    50%      { transform: rotate(-12deg); }
  }

  /* Head bob & beak clack */
  .head { transform-origin: 210px 215px; animation: headbob 0.5s ease-in-out infinite; }
  @keyframes headbob {
    0%, 100% { transform: rotate(-3deg) translateY(0); }
    50%      { transform: rotate(3deg) translateY(-2px); }
  }
  .beak-top { transform-origin: 210px 232px; animation: clack 0.35s ease-in-out infinite; }
  @keyframes clack {
    0%, 100% { transform: rotate(-2deg); }
    50%      { transform: rotate(4deg); }
  }

  /* Tail wag */
  .tail { transform-origin: 320px 262px; animation: wag 0.6s ease-in-out infinite; }
  @keyframes wag {
    0%, 100% { transform: rotate(-4deg); }
    50%      { transform: rotate(5deg); }
  }

  /* Speed lines */
  .speed line { animation: streak 0.5s linear infinite; opacity: 0; }
  .speed line:nth-child(1) { animation-delay: 0s; }
  .speed line:nth-child(2) { animation-delay: 0.12s; }
  .speed line:nth-child(3) { animation-delay: 0.24s; }
  .speed line:nth-child(4) { animation-delay: 0.36s; }
  @keyframes streak {
    0%   { transform: translateX(60px); opacity: 0; }
    30%  { opacity: 0.8; }
    100% { transform: translateX(-160px); opacity: 0; }
  }

  .sun { animation: sunpulse 4s ease-in-out infinite; transform-origin: 800px 90px; }
  @keyframes sunpulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }

  .caption {
    text-align: center;
    margin-top: 10px;
    color: #2b3a4a;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="scene">
    <svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" aria-label="Pelican riding a bicycle">
      <defs>
        <radialGradient id="sky" cx="50%" cy="20%" r="90%">
          <stop offset="0%" stop-color="#bfe6f7"/>
          <stop offset="100%" stop-color="#eaf7fb"/>
        </radialGradient>
        <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#9bd17a"/>
          <stop offset="100%" stop-color="#6fae57"/>
        </linearGradient>
        <linearGradient id="hillG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#a9d49a"/>
          <stop offset="100%" stop-color="#8cc47f"/>
        </linearGradient>
        <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f7f3e6"/>
          <stop offset="100%" stop-color="#e6dcc0"/>
        </linearGradient>
        <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#f6c343"/>
          <stop offset="100%" stop-color="#e89c20"/>
        </linearGradient>
        <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f4d77a"/>
          <stop offset="100%" stop-color="#e9b94e"/>
        </linearGradient>
        <linearGradient id="wingG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fbf7ec"/>
          <stop offset="100%" stop-color="#d9cfae"/>
        </linearGradient>
        <linearGradient id="frameG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e8543f"/>
          <stop offset="100%" stop-color="#c23a2b"/>
        </linearGradient>
        <radialGradient id="tireG" cx="50%" cy="50%" r="50%">
          <stop offset="70%" stop-color="#2b2b2b"/>
          <stop offset="82%" stop-color="#444"/>
          <stop offset="100%" stop-color="#1c1c1c"/>
        </radialGradient>
      </defs>

      <!-- Sky -->
      <rect x="0" y="0" width="900" height="520" fill="url(#sky)"/>

      <!-- Sun -->
      <g class="sun">
        <circle cx="810" cy="95" r="52" fill="#ffe08a"/>
        <circle cx="810" cy="95" r="42" fill="#ffd54f"/>
      </g>

      <!-- Clouds -->
      <g class="clouds" fill="#ffffff" opacity="0.9">
        <g transform="translate(120,90)">
          <ellipse cx="0" cy="0" rx="60" ry="26"/>
          <ellipse cx="-38" cy="8" rx="34" ry="22"/>
          <ellipse cx="40" cy="8" rx="38" ry="22"/>
          <ellipse cx="8" cy="-16" rx="34" ry="22"/>
        </g>
        <g transform="translate(560,60)">
          <ellipse cx="0" cy="0" rx="52" ry="22"/>
          <ellipse cx="-32" cy="6" rx="28" ry="18"/>
          <ellipse cx="34" cy="6" rx="32" ry="18"/>
        </g>
      </g>

      <!-- Distant hills (parallax) -->
      <g class="hills">
        <path d="M0,360 Q150,290 300,350 T600,340 T900,350 L900,520 L0,520 Z" fill="url(#hillG)"/>
        <path d="M-200,380 Q-50,320 100,370 T400,360 T700,370 T1000,360 L1000,520 L-200,520 Z" fill="#7fb86f" opacity="0.75"/>
      </g>

      <!-- Ground -->
      <g class="ground">
        <rect x="-80" y="400" width="1160" height="120" fill="url(#groundG)"/>
        <!-- ground texture dashes -->
        <g stroke="#5f9a4b" stroke-width="4" opacity="0.6">
          <line x1="0" y1="432" x2="40" y2="432"/>
          <line x1="120" y1="452" x2="170" y2="452"/>
          <line x1="260" y1="428" x2="300" y2="428"/>
          <line x1="380" y1="460" x2="430" y2="460"/>
          <line x1="520" y1="436" x2="565" y2="436"/>
          <line x1="640" y1="455" x2="690" y2="455"/>
          <line x1="760" y1="432" x2="805" y2="432"/>
          <line x1="880" y1="458" x2="925" y2="458"/>
          <line x1="1000" y1="436" x2="1045" y2="436"/>
        </g>
        <!-- pebbles -->
        <g fill="#6fae57" opacity="0.8">
          <circle cx="80" cy="470" r="6"/>
          <circle cx="220" cy="486" r="5"/>
          <circle cx="460" cy="474" r="7"/>
          <circle cx="600" cy="492" r="5"/>
          <circle cx="820" cy="478" r="6"/>
          <circle cx="950" cy="490" r="5"/>
        </g>
      </g>

      <!-- Speed lines behind bike -->
      <g class="speed" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85">
        <line x1="120" y1="250" x2="200" y2="250"/>
        <line x1="90"  y1="290" x2="180" y2="290"/>
        <line x1="140" y1="330" x2="220" y2="330"/>
        <line x1="100" y1="210" x2="170" y2="210"/>
      </g>

      <!-- ============ BICYCLE + PELICAN ============ -->
      <g class="bike-bob">

        <!-- Back wheel -->
        <g class="wheel-spin">
          <circle cx="150" cy="360" r="78" fill="url(#tireG)"/>
          <circle cx="150" cy="360" r="70" fill="none" stroke="#cfcfcf" stroke-width="4"/>
          <g stroke="#d9d9d9" stroke-width="3">
            <line x1="150" y1="290" x2="150" y2="430"/>
            <line x1="80"  y1="360" x2="220" y2="360"/>
            <line x1="100" y1="310" x2="200" y2="410"/>
            <line x1="200" y1="310" x2="100" y2="410"/>
          </g>
          <circle cx="150" cy="360" r="10" fill="#555"/>
        </g>

        <!-- Front wheel -->
        <g class="wheel-spin-b">
          <circle cx="450" cy="360" r="78" fill="url(#tireG)"/>
          <circle cx="450" cy="360" r="70" fill="none" stroke="#cfcfcf" stroke-width="4"/>
          <g stroke="#d9d9d9" stroke-width="3">
            <line x1="450" y1="290" x2="450" y2="430"/>
            <line x1="380" y1="360" x2="520" y2="360"/>
            <line x1="400" y1="310" x2="500" y2="410"/>
            <line x1="500" y1="310" x2="400" y2="410"/>
          </g>
          <circle cx="450" cy="360" r="10" fill="#555"/>
        </g>

        <!-- Frame -->
        <g stroke="url(#frameG)" stroke-width="12" stroke-linecap="round" fill="none">
          <!-- main triangle -->
          <path d="M300,360 L150,360 L150,300 L300,360"/>
          <!-- seat tube up to seat -->
          <path d="M150,300 L205,262"/>
          <!-- down tube to crank -->
          <path d="M300,360 L300,360"/>
          <!-- top tube -->
          <path d="M150,300 L300,360"/>
          <!-- fork to front wheel -->
          <path d="M300,360 L450,360"/>
          <path d="M300,360 L430,300"/>
          <path d="M430,300 L450,360"/>
        </g>
        <!-- handlebars -->
        <g stroke="#3a3a3a" stroke-width="9" stroke-linecap="round" fill="none">
          <path d="M430,300 C420,285 400,285 392,296"/>
        </g>
        <circle cx="430" cy="300" r="8" fill="#444"/>
        <!-- seat -->
        <path d="M175,246 q40,-14 60,0 q-10,12 -30,12 q-20,0 -30,-12 z" fill="#3a2f22"/>

        <!-- Crank + pedals -->
        <g class="crank">
          <circle cx="300" cy="360" r="16" fill="#555"/>
          <line x1="300" y1="360" x2="330" y2="360" stroke="#444" stroke-width="8" stroke-linecap="round"/>
          <line x1="300" y1="360" x2="270" y2="360" stroke="#444" stroke-width="8" stroke-linecap="round"/>
          <rect x="322" y="352" width="22" height="14" rx="4" fill="#2b2b2b"/>
          <rect x="262" y="352" width="22" height="14" rx="4" fill="#2b2b2b"/>
        </g>

        <!-- ===== PELICAN ===== -->
        <!-- Tail -->
        <g class="tail">
          <path d="M320,262 q30,-6 44,18 q-18,-2 -34,6 q-10,-12 -10,-24 z" fill="#e6dcc0"/>
        </g>

        <!-- Body -->
        <g>
          <ellipse cx="255" cy="285" rx="78" ry="52" fill="url(#bodyG)"/>
          <!-- belly shading -->
          <ellipse cx="262" cy="305" rx="60" ry="38" fill="#f3ecd8" opacity="0.7"/>
        </g>

        <!-- Wing -->
        <g class="wing">
          <path d="M250,250 q-40,-30 -78,-18 q30,6 52,26 q-24,8 -46,4 q26,16 58,10 q14,-6 14,-22 z" fill="url(#wingG)"/>
          <path d="M250,250 q-30,-22 -60,-14" stroke="#c9bd97" stroke-width="2" fill="none"/>
        </g>

        <!-- Legs (thighs) — pivoting at hip ~ (270,300) -->
        <!-- Back leg -->
        <g class="leg-thigh-r">
          <g class="leg-shin-r">
            <path d="M270,300 L282,330" stroke="#e6a23c" stroke-width="14" stroke-linecap="round"/>
            <path d="M282,330 L276,358" stroke="#e6a23c" stroke-width="12" stroke-linecap="round"/>
            <!-- webbed foot on pedal -->
            <path d="M268,358 q12,-8 22,0 q-6,10 -11,8 q-5,-2 -11,-8 z" fill="#d18a1f"/>
          </g>
        </g>
        <!-- Front leg -->
        <g class="leg-thigh-l">
          <g class="leg-shin-l">
            <path d="M270,300 L262,332" stroke="#e6a23c" stroke-width="14" stroke-linecap="round"/>
            <path d="M262,332 L288,356" stroke="#e6a23c" stroke-width="12" stroke-linecap="round"/>
            <path d="M280,356 q12,-6 20,2 q-6,10 -10,8 q-4,-2 -10,-10 z" fill="#d18a1f"/>
          </g>
        </g>

        <!-- Neck -->
        <g>
          <path d="M232,262 q-18,-40 6,-66 q10,-12 26,-12 q-6,20 -2,34 q-8,10 -18,14 q12,6 16,22 q-2,14 -12,18 z" fill="url(#bodyG)"/>
        </g>

        <!-- Head -->
        <g class="head">
          <circle cx="210" cy="200" r="34" fill="url(#bodyG)"/>
          <!-- eye -->
          <circle cx="222" cy="192" r="6" fill="#2b2b2b"/>
          <circle cx="224" cy="190" r="2" fill="#ffffff"/>
          <!-- small crest tuft -->
          <path d="M196,170 q-6,-12 2,-18 q6,10 8,16 z" fill="#e6dcc0"/>

          <!-- Big beak: top -->
          <g class="beak-top">
            <path d="M178,206 q-58,10 -92,4 q6,16 30,22 q30,8 62,-2 q10,-12 0,-24 z" fill="url(#beakG)"/>
            <path d="M178,212 q-50,8 -82,4 q6,12 28,18 q28,6 54,-2 z" fill="#f6c343"/>
          </g>
          <!-- Beak: bottom (pouch) -->
          <path d="M178,224 q-46,8 -74,4 q8,22 40,26 q34,4 44,-12 q4,-12 -10,-18 z" fill="url(#pouchG)"/>
          <path d="M178,224 q-40,6 -66,2 q6,16 34,22 q28,6 40,-8 z" fill="#f4d77a"/>
        </g>

      </g>

      <!-- Shadow under bike -->
      <ellipse cx="300" cy="452" rx="220" ry="16" fill="#3c6b2f" opacity="0.35"/>

    </svg>
    <div class="caption">🚲 Pelican Pedal Power 🦜</div>
  </div>
</body>
</html>
