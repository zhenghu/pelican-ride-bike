name: Validate animation ranking
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/update-catalog.py --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
